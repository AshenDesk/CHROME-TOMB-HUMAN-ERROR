  PREMISSA
  --------
  Dungeon-crawler de texto em terminal para navegador. Single-file, zero
  dependências, zero back-end. O jogador comanda um operativo cibernético
  infiltrando o Setor Alpha-7 para roubar dados do Datavault Omega.

  PERSONAGEM — Três classes disponíveis
  ──────────────────────────────────────
  Runner Fantasma  HP 13  STR 11  ARM 0  MEL +2  HCK +3  RNG +3  PA 4
  Crente de Cromo  HP 17  STR  9  ARM 1  MEL +4  HCK +1  RNG +1  PA 4
  Mago de Rua      HP 11  STR 13  ARM 0  MEL +1  HCK +5  RNG +2  PA 4

  ATRIBUTOS
  ─────────
  HP      — Pontos de vida. 0 = fim de jogo.
  Estresse— Pressão mental. Max → Colapso Nervoso.
  Armadura— Reduz dano recebido.
  Melee   — Mod. em ataques corpo a corpo.
  Hack    — Mod. em intrusões digitais e varredura.
  Ranged  — Mod. em disparos, iniciativa e esquiva passiva (DR = 10 + Ranged).
  PA      — Pontos de Ação / mana de intrusão. Hack sempre custa 1 PA.
  Ruído   — Alerta do setor. Max → Lockdown / Esquadrão de Resposta.
  Créditos— Moeda do jogo.

  INICIATIVA
  ──────────
  Rolagem: d6 + Ranged.  ≤ 4 = inimigo age primeiro.  ≥ 5 = jogador primeiro.

  COMBATE — TURNO DO JOGADOR
  ──────────────────────────
  Atacar    d20 + Melee    vs DR (12 + ARM inimigo)    —  sem custo
  Hackear   d20 + Hack     vs DR (12 + ARM inimigo)    —  custa 1 PA
  Disparar  d6 câmara (1=trava, 2-6 = 1-5 tiros)
              cada tiro: d20 + Ranged vs DR (12 + ARM)  —  gasta munição
  Varredura d20 + Hack     vs DR (12 + ARM inimigo)    —  custa 1 PA (mesma DR do combate)
  Usar Item efeito imediato                             —  gasta item
  Fugir     chance baseada em Ranged + perks + itens   —  sem custo

  COMBATE — TURNO DO INIMIGO
  ──────────────────────────
  d20 + ATK inimigo vs DR (10 + Ranged do jogador)
  Nat 20 = crítico (dano ×1,5).  Cada inimigo tem `special` extra.

  Specials: bleed (str+1 30%), alarm (ruído+2 30%), noise (ruído+1 40%),
            mindspike (str+1 100%), corrode (+2 dmg, ignora ARM),
            lockdown (25% trava jogador 1 turno), swarm (2 golpes),
            phase (Fase 2 no 50% HP: atk+1, 25% dano dobrado).

  DADOS DE DESCANSO (d6)
  ──────────────────────
  1–3  Silencioso: HP+2, Estresse-2, PA=max, efeito passivo de zona.
  4    HP+1, PA=metade, Estresse+1d2, Ruído+1d3 — "Barulho fora do controle..."
  5    HP+1, PA=metade, Estresse+1d2, Ruído+1d3 — "Um ruído involuntário vaza..."
  6    HP+1, PA=metade, Estresse+1d2, Ruído+1d3 — "Você sente estar sendo observado..."

  RUÍDO PASSIVO POR ZONA
  ──────────────────────
  Calma   (Refúgio Neon, Mercado, Dreno)  → Ruído -1 ao descansar/esperar
  Estável (Clínica, Beco de Dados)        → Ruído não muda automaticamente
  Monitorada (demais salas)               → dado de descanso decide

  HACK DE SALA (hub)
  ──────────────────
  Corredor do Cofre      DR 11  → destranca Sala de Servidores
  Sala de Servidores     DR 12  → Cifra de Rede (1º hack)
  Sala de Servidores     DR 13  → destrava elevador p/ Núcleo K-9 (2º hack, após a Cifra)
  Antecâmara de Seg.     DR 13  → acesso ao Datavault Omega
  Datavault Omega        DR 16 (13 após o 1º hack nos Servidores) → inicia boss Sentinela do Cofre
  Falhas acumulam +1 DR (até +3). Falha em salas vigiadas pode causar reação hostil.

  REDE DE SENTINELAS — Drones respondem ao ARCHON K-9
  ────────────────────────────────────────────────────
  Malha de segurança: Corredor do Cofre, Sala de Servidores, Datavault Omega,
  Beco de Dados e Antecâmara de Segurança.
  • Unidade 01 = Drone-Sentinela do Corredor. Qualquer combate com ela → Alerta
    permanente (sem mais diálogo). Falar após hack bem-sucedido → combate imediato.
  • Unidade 01 viva e alertada (inclusive depois de uma fuga) caça você em TODA a
    malha: d6+Ranged ≤ 4 ao esperar/descansar/saquear, 35% ao entrar numa sala da
    malha (fora do corredor) e chance de interferir em hacks.
  • Neutralizar a Unidade 01 (por qualquer caminho) encerra o alerta, libera a grade
    sul e cancela perseguições. Ela nunca mais reaparece; nenhum sorteio comum de
    sala (emboscada, esperar, descansar) pode recriá-la.
  • Fuga → perseguição com prazo: 4 ações (mover/esperar/descansar/saquear). A cada
    ação há 40% + 5% por ponto de Ruído (máx. 80%) de a unidade te alcançar, em
    qualquer sala do hub. Sem alcance, a central "perde o rastro". Descer ao Núcleo
    K-9 também a encerra.
  • Reforços (a central responde): só depois da Unidade 01 cair, com Ruído ≥ 4, em
    qualquer sala da malha, a cada ação (mover, esperar, descansar, saquear, hackear)
    com 65% de chance. Cooldown de apenas 1 ação após cada baixa e no máximo 2
    reforços por partida (Unidades 02 e 03, ATK +1).
  • Reforço que fugiu não morreu: ao fim do rastreio volta ao estoque da central e
    pode ser despachado de novo. Abatidos os dois, a central não tem mais unidades.
  • Dica: manter o Ruído abaixo de 4 impede a central de responder.

  MAPA DO HUB — ALPHA-7 (grid 3×3)
  ──────────────────────────────────
  [0,0 Refúgio Neon] ─── [1,0 Clínica] ─── [2,0 Corredor do Cofre]
         |                   |                        |
  [0,1 Mercado]  ─── [1,1 Beco de Dados]   [2,1 Sala de Servidores]
                             |                       |
  [0,2 Dreno de Carga] ─ [1,2 Antecâmara] ─ [2,2 Datavault Omega]

  Beco de Dados NÃO conecta à Sala de Servidores (muro corporativo).
  Corredor do Cofre→Servidores requer hack (lockFlag: serverAccess).
  Antecâmara→Datavault requer hack ou suborno (lockFlag: vaultAccess).

  NÚCLEO K-9 — 3 andares × 3 salas
  ──────────────────────────────────
  Tipos de sala: cache, glitch, corpse, terminal, hacker, ambush, turret, empty.
  Andar 2, sala 2: hacker anônimo garantido (senha da Capa por 14cr, 80% sucesso).
  Boss final: ARCHON K-9 (HP24, ATK5, ARM2, 2 fases).
  Backtracking: Retroceder preserva posição. Descer retoma de onde parou.

  ITENS NOTÁVEIS
  ──────────────
  Stim Patch       HP+6
  Célula Bateria   PA+2 (qualquer momento)
  Granada Fumaça   Ruído-3 / fuga+25% em combate
  Overclock        Rerrola próxima ação ofensiva
  Colete Reforçado Passivo equipável: ARM+1, permanece no inventário (1 slot)
  Pistola Auto.    Habilita Disparar. Munição: 20un = 1 slot de carga.
  Rifle Eletromag. Ranged +1 passivo. Disparar: d8 + Ranged (tiro único, 1 projétil .50)
                     ≤5 erra (gasta projétil) · 6 falha (poupa projétil) · 7 acerta
                     ≥8 crítico (dano dobrado). Dano = 2 × (d8 + Ranged) − ARM.
                     Mercado de Sucata, 20cr, após ≥2 objetivos. Projétil .50: par por 5cr.
  Capa Termo-óptica Fuga+25%, surpr. ignora ARM +3dmg. Senha do hacker anônimo no
                     Núcleo K-9 (14cr, 80%) ou loot raro de inimigos.
  Cifra de Rede    Hack vs sintéticos +4 dmg / usada nos servidores abre o elevador do
                     Núcleo K-9 (2º estágio).

  OBJETIVOS (para extração)
  ─────────────────────────
  1. Hackear a Sala de Servidores (Cifra de Rede) e destravar o elevador do Núcleo K-9.
  2. Derrotar Sentinela do Cofre no Datavault Omega.
  3. Derrotar ARCHON K-9 no Núcleo K-9 e recuperar a matriz.
  → Retornar ao Refúgio Neon e usar EXTRAIR.

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#06080b" />
<meta name="description" content="CHROME TOMB // HUMAN ERROR — dungeon-crawler de texto cyberpunk em terminal, single-file, zero dependências. Infiltre o Datavault Omega. Não acorde o ARCHON K-9." />
<title>CHROME TOMB // HUMAN ERROR</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap');

:root{
  --void:#06080b;
  --panel:#0c1117;
  --panel2:#10171f;
  --hair:#1c2932;
  --ink:#d8ece6;
  --muted:#5e7b78;
  --dim:#3f5a57;
  --signal:#39e0c2;
  --signal-soft: rgba(57,224,194,.14);
  --amber:#f0b429;
  --threat:#ff4d6a;
  --ghost:#b48bff;
  --gold:#e8c468;
  --good:#6be8a8;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --display: 'Space Grotesk', var(--mono);
}
*{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
html,body{
  margin:0; height:100%; width:100%; overflow:hidden; overscroll-behavior:none;
  background:
    radial-gradient(circle at 15% 0%, rgba(57,224,194,.07), transparent 32%),
    radial-gradient(circle at 90% 8%, rgba(180,139,255,.06), transparent 26%),
    linear-gradient(180deg, #050709 0%, #060809 100%);
  color:var(--ink);
  font-family:var(--mono);
}
body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:1;
  background:repeating-linear-gradient(180deg, rgba(255,255,255,.018) 0px, rgba(255,255,255,.018) 1px, transparent 2px, transparent 4px);
  mix-blend-mode:screen; opacity:.4;
}
button{ appearance:none; border:none; cursor:pointer; font-family:var(--mono); }
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:var(--hair); border-radius:8px; }
::-webkit-scrollbar-track{ background:transparent; }

.page{ position:relative; z-index:2; height:100vh; height:100svh; height:100dvh; display:flex; flex-direction:column; }

/* ---- topbar ---- */
.topbar{
  flex:0 0 auto;
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:clamp(7px,2vw,10px) clamp(10px,3vw,16px);
  border-bottom:1px solid var(--hair);
  background:linear-gradient(90deg, rgba(57,224,194,.06), rgba(180,139,255,.04));
  flex-wrap:wrap;
}
.brand{ display:flex; align-items:baseline; gap:clamp(6px,2vw,10px); }
.brand b{
  font-family:var(--display); font-size:clamp(13px,3.6vw,16px); letter-spacing:.04em; color:var(--signal);
  text-shadow:0 0 14px rgba(57,224,194,.25);
}
.brand .cursor{ display:inline-block; width:8px; height:14px; background:var(--signal); margin-left:2px; animation:blink 1.1s steps(2) infinite; vertical-align:-2px; }
.brand span{ color:var(--muted); font-size:clamp(9px,2.4vw,11px); letter-spacing:.07em; text-transform:uppercase; }
@keyframes blink{ 50%{ opacity:.15; } }
.topbar-right{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.pills{ display:flex; gap:5px; flex-wrap:wrap; }
.pill{
  display:flex; align-items:center; gap:5px;
  border:1px solid var(--hair); border-radius:999px;
  padding:clamp(3px,1vw,4px) clamp(7px,2vw,10px); font-size:clamp(9.5px,2.6vw,11px); background:rgba(255,255,255,.02);
}
.pill .k{ color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-size:clamp(8.5px,2.2vw,10px); }
.pill .v{ color:var(--ink); font-weight:600; }
.pill.hp .v{ color:var(--good); }
.pill.ap .v{ color:var(--signal); }
.pill.stress .v{ color:var(--ghost); }
.pill.noise .v{ color:var(--threat); }
.pill.cred .v{ color:var(--gold); }
.bonus{ color:var(--good); font-size:10.5px; font-weight:600; }
.equip-row{ font-size:11.5px; color:var(--signal); margin:3px 0; }
.icon-btn{
  flex:0 0 auto; border:1px solid var(--hair); background:rgba(255,255,255,.025);
  color:var(--muted); border-radius:8px; padding:clamp(5px,1.6vw,7px) clamp(8px,2.2vw,10px);
  font-size:clamp(12px,3vw,14px); line-height:1;
}
.icon-btn:hover{ border-color:var(--signal); color:var(--signal); }
.icon-btn.active{ border-color:var(--signal); color:var(--signal); background:rgba(57,224,194,.12); }

/* ---- layout ---- */
.layout{
  flex:1 1 auto; min-height:0;
  display:grid; grid-template-columns: 270px 1fr 290px; gap:clamp(8px,2vw,12px);
  padding:clamp(8px,2.4vw,12px) clamp(8px,2.4vw,12px) 0 clamp(8px,2.4vw,12px);
}
.panel{
  background:linear-gradient(180deg, rgba(16,23,31,.92), rgba(8,12,16,.92));
  border:1px solid var(--hair); border-radius:14px;
  box-shadow:0 16px 50px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.02);
  min-height:0; display:flex; flex-direction:column; overflow:hidden;
}
.panel-head{
  flex:0 0 auto; padding:clamp(8px,2vw,10px) clamp(10px,2.6vw,14px); font-size:clamp(10px,2.6vw,11px); letter-spacing:.1em; text-transform:uppercase;
  color:var(--signal); border-bottom:1px solid var(--hair);
  display:flex; justify-content:space-between; align-items:center;
  background:linear-gradient(90deg, rgba(57,224,194,.05), transparent);
}
.panel-head .tag{ color:var(--muted); font-size:10px; letter-spacing:.06em; }
.panel-body{ flex:1 1 auto; min-height:0; overflow:auto; padding:clamp(9px,2.6vw,12px) clamp(10px,2.8vw,14px); }
.side{ display:none; }
@media (min-width: 981px){ .side{ display:flex; } }

.terminal-col{ min-width:0; }
.screen{
  flex:1 1 auto; min-height:0; overflow-y:auto; padding:clamp(10px,2.8vw,14px) clamp(11px,3vw,16px);
  background:
    linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.014) 1px, transparent 1px),
    rgba(4,6,8,.5);
  background-size:100% 22px, 22px 100%, auto;
}
.line{ white-space:pre-wrap; word-break:break-word; margin:0 0 9px; font-size:clamp(11.5px,3vw,13px); line-height:1.55; animation:lineIn .16s ease both; }
@keyframes lineIn{ from{ opacity:0; transform:translateY(3px); } to{ opacity:1; transform:none; } }
.line.sys{ color:var(--muted); }
.line.dim{ color:var(--dim); }
.line.good{ color:var(--good); }
.line.warn{ color:var(--amber); }
.line.bad{ color:var(--threat); }
.line.accent{ color:var(--signal); }

.choices{ display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 16px; animation:lineIn .18s ease both; }
.chip{
  background:linear-gradient(180deg, rgba(57,224,194,.1), rgba(57,224,194,.03));
  border:1px solid rgba(57,224,194,.28);
  color:var(--ink); border-radius:8px; padding:clamp(6px,1.8vw,7px) clamp(8px,2.4vw,11px); font-size:clamp(10.5px,2.9vw,12px);
  letter-spacing:.01em; transition:transform .08s ease, border-color .12s ease, background .12s ease;
  position:relative;
}
.chip::before{ content:"❯"; color:var(--signal); margin-right:6px; font-size:11px; }
.chip:hover{ transform:translateY(-1px); border-color:var(--signal); background:rgba(57,224,194,.16); }
.chip:disabled, .chip.spent{ opacity:.32; cursor:default; transform:none; border-color:var(--hair); }
.chip:disabled::before, .chip.spent::before{ color:var(--muted); }

/* ---- status / location panel content ---- */
.stat{ border:1px solid var(--hair); border-radius:10px; padding:clamp(8px,2.2vw,9px) clamp(9px,2.4vw,10px); background:rgba(255,255,255,.015); margin-bottom:8px; }
.stat .k{ color:var(--muted); font-size:clamp(9px,2.4vw,10px); text-transform:uppercase; letter-spacing:.07em; }
.stat .v{ margin-top:3px; font-size:clamp(12.5px,3.2vw,14px); }
.bar{ height:7px; margin-top:7px; background:#0c1318; border-radius:999px; overflow:hidden; border:1px solid rgba(255,255,255,.05); }
.fill{ height:100%; background:linear-gradient(90deg, var(--signal), #5ad1ff); }
.fill.stress{ background:linear-gradient(90deg, var(--ghost), #6a5bd8); }
.fill.noise{ background:linear-gradient(90deg, var(--amber), var(--threat)); }
.fill.ap{ background:linear-gradient(90deg, var(--good), var(--signal)); }
.statgrid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.card{ border:1px solid var(--hair); border-radius:10px; padding:clamp(9px,2.4vw,10px); background:rgba(255,255,255,.012); margin-bottom:8px; font-size:clamp(11px,2.8vw,12px); line-height:1.5; }
.card h4{ margin:0 0 6px; font-size:clamp(10px,2.6vw,11px); color:var(--signal); text-transform:uppercase; letter-spacing:.08em; }
.npc-card{ border:1px solid rgba(180,139,255,.18); background:rgba(20,12,28,.4); border-radius:10px; padding:clamp(7px,2vw,8px) clamp(8px,2.2vw,9px); margin-bottom:7px; font-size:clamp(11px,2.8vw,12px); line-height:1.45; }
.npc-card strong{ color:var(--ghost); }
.obj-row{ border-left:3px solid rgba(57,224,194,.4); padding:clamp(5px,1.6vw,6px) clamp(8px,2.2vw,9px); margin-bottom:6px; background:rgba(255,255,255,.012); border-radius:8px; font-size:clamp(11px,2.8vw,12px); line-height:1.4; }
.obj-row.done{ border-left-color:var(--good); opacity:.6; text-decoration:line-through; }
.item-row{ display:flex; justify-content:space-between; align-items:center; gap:8px; border:1px solid var(--hair); border-radius:10px; padding:clamp(7px,2vw,8px) clamp(9px,2.4vw,10px); margin-bottom:7px; font-size:clamp(11px,2.8vw,12px); background:rgba(255,255,255,.012); }
.item-row .meta{ color:var(--muted); font-size:clamp(9.5px,2.4vw,10.5px); margin-top:2px; }
.mini-btn{ border:1px solid var(--hair); background:rgba(255,255,255,.03); color:var(--ink); border-radius:7px; padding:clamp(4px,1.4vw,5px) clamp(7px,2vw,8px); font-size:clamp(10px,2.6vw,11px); flex:0 0 auto; }
.mini-btn:hover{ border-color:var(--signal); }
.mini-btn.danger:hover{ border-color:var(--threat); }
.mini-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:5px; margin-bottom:10px; }
.mini-cell{ border:1px solid var(--hair); border-radius:8px; padding:clamp(6px,1.8vw,8px) 4px; text-align:center; font-size:clamp(8.5px,2.2vw,9.5px); letter-spacing:.04em; text-transform:uppercase; color:var(--muted); background:rgba(255,255,255,.012); }
.mini-cell.here{ border-color:var(--signal); color:var(--signal); background:rgba(57,224,194,.08); box-shadow:0 0 12px rgba(57,224,194,.18); }
.kbd{ display:inline-block; padding:1px 6px; border-radius:5px; border:1px solid var(--hair); background:rgba(255,255,255,.04); font-size:10.5px; }

/* ---- fixed shell ---- */
.shell{ flex:0 0 auto; border-top:1px solid var(--hair); background:linear-gradient(180deg, rgba(8,10,13,.6), rgba(7,9,11,.97)); padding:clamp(7px,2vw,9px) clamp(8px,2.4vw,12px) calc(clamp(7px,2vw,9px) + env(safe-area-inset-bottom)); }
.shell-menu{ display:flex; gap:6px; margin-bottom:clamp(6px,1.8vw,8px); overflow-x:auto; scrollbar-width:none; }
.shell-menu::-webkit-scrollbar{ display:none; }
.menu-btn{ flex:0 0 auto; border:1px solid var(--hair); background:rgba(255,255,255,.025); color:var(--muted); border-radius:8px; padding:clamp(6px,1.8vw,7px) clamp(9px,2.6vw,12px); font-size:clamp(10px,2.6vw,11px); letter-spacing:.06em; white-space:nowrap; }
.menu-btn:hover{ border-color:var(--signal); color:var(--ink); }
.shell-input-row{ display:flex; align-items:center; gap:8px; }
.shell-prompt{ color:var(--signal); font-size:12px; flex:0 0 auto; display:none; }
@media (min-width:560px){ .shell-prompt{ display:block; } }
.shell-input{
  flex:1 1 auto; background:#050709; border:1px solid var(--hair); border-radius:10px;
  color:var(--ink); padding:clamp(9px,2.6vw,11px) clamp(10px,2.8vw,12px); font-family:var(--mono); font-size:clamp(13px,3.2vw,14px); outline:none;
}
.shell-input:focus{ border-color:var(--signal); box-shadow:0 0 0 3px rgba(57,224,194,.1); }
.shell-send{ background:linear-gradient(180deg, rgba(57,224,194,.22), rgba(57,224,194,.08)); border:1px solid rgba(57,224,194,.4); color:var(--ink); border-radius:10px; padding:clamp(9px,2.6vw,11px) clamp(11px,3vw,14px); font-size:clamp(10.5px,2.8vw,12px); letter-spacing:.05em; flex:0 0 auto; }
.shell-send:hover{ border-color:var(--signal); }

/* ---- drawer ---- */
.drawer-overlay{ position:fixed; inset:0; background:rgba(4,6,8,.66); z-index:90; opacity:0; pointer-events:none; transition:opacity .2s ease; }
.drawer-overlay.open{ opacity:1; pointer-events:auto; }
.drawer{
  position:absolute; background:linear-gradient(180deg, rgba(16,22,29,.99), rgba(8,11,15,.99));
  border:1px solid var(--hair); box-shadow:-10px 0 50px rgba(0,0,0,.5);
  display:flex; flex-direction:column; transition:transform .25s ease;
}
.drawer-head{ display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--hair); }
.drawer-head span{ color:var(--signal); font-size:12px; letter-spacing:.09em; text-transform:uppercase; }
.drawer-close{ background:rgba(255,255,255,.04); border:1px solid var(--hair); color:var(--ink); border-radius:8px; padding:4px 9px; font-size:13px; }
.drawer-close:hover{ border-color:var(--threat); color:var(--threat); }
.drawer-body{ flex:1 1 auto; overflow:auto; padding:14px 16px; }
@media (min-width:981px){
  .drawer{ top:0; right:0; height:100%; width:380px; border-radius:0; transform:translateX(100%); }
  .drawer-overlay.open .drawer{ transform:translateX(0); }
}
@media (max-width:980px){
  .drawer{ left:0; right:0; bottom:0; max-height:80vh; border-radius:18px 18px 0 0; transform:translateY(100%); }
  .drawer-overlay.open .drawer{ transform:translateY(0); }
}

@media (max-width:980px){
  .layout{ grid-template-columns:1fr; padding:8px 8px 0; }
  .topbar{ padding:8px 10px; }
}
@media (max-width:420px){
  .topbar{ gap:6px; }
  .brand{ gap:5px; }
  .pills{ gap:4px; }
  .statgrid{ grid-template-columns:1fr; }
  .mini-grid{ gap:4px; }
  .choices{ gap:5px; }
  .shell-menu{ gap:5px; }
}
@media (max-height:560px){
  .shell{ padding-top:5px; padding-bottom:calc(5px + env(safe-area-inset-bottom)); }
  .shell-menu{ margin-bottom:5px; }
  .panel-body{ padding-top:7px; padding-bottom:7px; }
}

</div>

  const SENTRY_NET_ROOMS = ['vaultcorridor','server','vault','alley','security'];
  const SENTRY_PURSUIT_TICKS = 4;        // ações (mover/esperar/descansar/saquear) de rastreio após uma fuga
  const SENTRY_COOLDOWN = 1;             // ações na malha antes de a central poder despachar outra unidade
  const SENTRY_MAX_REINFORCEMENTS = 2;   // Unidades 02 e 03
  const SENTRY_DISPATCH_NOISE = 4;       // Ruído mínimo para a central responder
  const SENTRY_DISPATCH_CHANCE = 0.65;   // por ação dentro da malha
  const SENTRY_ALERT_EMERGE_CHANCE = 0.35; // Unidade 01 viva e em alerta, fora do corredor

  function sentryUnitLabel(n){ return `Drone-Sentinela // Unidade ${String(n).padStart(2,'0')}`; }
  function corridorSentryDown(){ return !!state.npcDefeated['drone_sentry']; }
  function inSentryNet(room){ return !!room && SENTRY_NET_ROOMS.includes(room.id); }
  /* Unidade 01 alertada (por combate ou fuga) e ainda operante. */
  function unit01Hunting(){ return !!state.flags.sentryAlerted && !corridorSentryDown(); }
  /* Depois da Unidade 01, nenhum sorteio comum de sala pode recriá-la: só a central envia drones. */
  function sanitizeSentryPool(pool){

  }

    const p = state.flags.sentryPursuit;
    if(!p || state.mode!=='hub' || state.combat) return false;
    p.ticks--;
    const chance = clamp(0.4 + state.noise*0.05, 0.4, 0.8);
    if(Math.random() < chance){
      state.flags.sentryPursuit = null;
      log(arrivalMsg || `${sentryUnitLabel(p.unit)} te alcança — a central do Archon K-9 guiou o rastreio até a sua posição.`,'bad');
      startCombat('sentryDrone','hub',{ unit:p.unit });
      return true;
    }
    if(p.ticks<=0){
      const ended = endSentryPursuit();
      log(`O rastreio perde força entre os dutos. A central do Archon K-9 arquiva sua última posição conhecida${ended && ended.unit>1 ? ` e recolhe a ${sentryUnitLabel(ended.unit)} de volta à malha` : ''}.`,'sys');
    } else {

    }
    return false;

  /* Reforço despachado pela central depois que a Unidade 01 já caiu (qualquer sala da malha). */

    if(!inSentryNet(room)) return false;
    if(state.flags.sentryReinforcements >= SENTRY_MAX_REINFORCEMENTS) return false;
    if(state.flags.sentryPursuit) return false;
    if(state.flags.sentryCooldown > 0){ state.flags.sentryCooldown--; return false; }
    if(state.noise < SENTRY_DISPATCH_NOISE) return false;
    if(Math.random() >= SENTRY_DISPATCH_CHANCE) return false;
    const unit = 2 + state.flags.sentryReinforcements;
    state.flags.sentryReinforcements++;
    log(`A central do ARCHON K-9 localiza você em ${room.name}. A ${sentryUnitLabel(unit)} é liberada pelos dutos de manutenção.`,'bad');
    unlockLore('sentry_net');
    startCombat('sentryDrone','hub',{ unit });
    return true;
  }

  /* Encontro na malha: reforço (Unidade 01 já destruída) ou a própria Unidade 01 (viva e em alerta). */
  function maybeSentryEncounter(room){
    if(!inSentryNet(room) || state.combat || state.mode!=='hub') return false;
    if(corridorSentryDown()) return maybeDispatchSentry(room);
    if(unit01Hunting() && !state.flags.sentryPursuit && room.id!=='vaultcorridor'){
      if(Math.random() < SENTRY_ALERT_EMERGE_CHANCE){
        log(`${sentryUnitLabel(1)} desce pelos dutos de manutenção até ${room.name}, guiada pela central do Archon K-9.`,'bad');
        startCombat('sentryDrone','hub',{ unit:1 });
        return true;
      }
    }
    return false;
  }

  /* Chamado por endCombat quando qualquer Drone-Sentinela é neutralizado. */
  function resolveSentryDown(e){
    const unit = e.unit || 1;
    state.flags.sentryPursuit = null;
    state.flags.sentryKills++;
    state.flags.sentryCooldown = SENTRY_COOLDOWN;
    if(!corridorSentryDown()){
      state.npcDefeated['drone_sentry'] = true;
      log('Unidade 01 offline. Em algum monitor distante, o Archon K-9 registra a perda e já redireciona outra sentinela para a malha de segurança.','accent');
      const grant = NPCS.drone_sentry.grantsFlag;
      if(grant && !state.flags[grant]){
        state.flags[grant] = true;
        log(`${NPCS.drone_sentry.name} não vai mais incomodar você aqui. O caminho que ela guardava está livre.`,'accent');
      }
    } else {
      log(`${sentryUnitLabel(unit)} offline. A malha de patrulha do Archon K-9 apaga mais uma linha do mapa.`,'accent');
      if(state.flags.sentryReinforcements >= SENTRY_MAX_REINFORCEMENTS){
        log('A central chama por reforços e não obtém resposta: não restam unidades livres na superfície.','good');
      }
    }
  }

  /* ============================ HELPERS ============================ */
  function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function choice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function clamp(n,a,b){ return Math.max(a, Math.min(b, n)); }
  function rollD20(){ return 1 + Math.floor(Math.random()*20); }
  function roll(sides, mod=0){ return 1 + Math.floor(Math.random()*sides) + mod; }
  function posKey(x,y){ return x+','+y; }
  function weightedChoice(pairs){
    const total = pairs.reduce((s,p)=>s+p[1],0);
    let r = Math.random()*total;
    for(const [val,w] of pairs){ if(r<w) return val; r-=w; }
    return pairs[0][0];
  }
  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function effectiveRanged(){
    return (state.ranged||0) + (hasItem('rifle') ? 1 : 0);
  }
  function effectiveArmor(){
    return state.baseArmor + (hasItem('plated_vest') ? 1 : 0);
  }
  function derivedStats(){
    const melee  = state.melee  + (hasItem('shiv') ? 1 : 0);
    const hack   = state.hack;
    const ranged = effectiveRanged();
    const armor  = effectiveArmor();
    const equipped = [];
    if(hasItem('shiv'))        equipped.push('Lâmina Curta (Melee +1)');
    if(hasItem('plated_vest')) equipped.push('Colete Reforçado (ARM +1)');
    if(hasItem('pistol'))      equipped.push('Pistola Automática');
    if(hasItem('rifle'))       equipped.push('Rifle Eletromagnético (Ranged +1)');
    if(hasItem('cloak'))       equipped.push('Capa Termo-óptica');
    return { melee, hack, ranged, armor, equipped };
  }

  function randomSupplyDrop(){
    const lid = choice(['stim','battery','smoke','overclock','ammo']);
    const qty = lid==='ammo' ? rand(2,5) : 1;
    return { id:lid, qty, ok: addItem(lid,qty) };
  }
  function dropToGround(id, qty){
    if(state.mode==='dungeon' && state.dungeon){
      if(state.dungeon.groundLoot && state.dungeon.groundLoot.id===id){
        state.dungeon.groundLoot.qty += qty;
      } else {
        state.dungeon.groundLoot = { id, qty, roomsLeft:1 };
      }
    } else if(state.mode==='hub'){
      const room = currentRoom();
      room.groundLoot = room.groundLoot || [];
      const existing = room.groundLoot.find(g=>g.id===id);
      if(existing) existing.qty += qty; else room.groundLoot.push({ id, qty });
    } else {
      return;
    }
    log(`Carga cheia: ${ITEMS[id].name}${qty>1?` x${qty}`:''} fica no chão, saqueável nesta área.`,'warn');
  }
  function decayDungeonGroundLoot(){
    if(!state.dungeon || !state.dungeon.groundLoot) return;
    state.dungeon.groundLoot.roomsLeft--;
    if(state.dungeon.groundLoot.roomsLeft < 0){
      log(`${ITEMS[state.dungeon.groundLoot.id].name} deixado para trás não pôde mais ser rastreado.`,'dim');
      state.dungeon.groundLoot = null;
    }
  }
  function pickupDungeonGroundLoot(){
    if(!state.dungeon || !state.dungeon.groundLoot){ log('Não há nada para recolher aqui.','warn'); return; }
    const { id, qty } = state.dungeon.groundLoot;
    if(addItem(id, qty)){
      log(`Recolhido: ${ITEMS[id].name}${qty>1?` x${qty}`:''}.`,'good');
      state.dungeon.groundLoot = null;
    } else {
      log('Ainda sem espaço de carga para recolher este item.','warn');
    }
    renderAll();
    presentContextChoices();
  }
  function objectivesCompletedCount(){
    return [state.flags.cipher, state.flags.vaultCleared, state.flags.descended, state.flags.matrix].filter(Boolean).length;
  }
  function rifleUnlocked(){ return objectivesCompletedCount() >= 2; }
  function maybeAnnounceRifle(context){
    if(context==='market' && rifleUnlocked() && !state.flags.rifleOfferShown){
      state.flags.rifleOfferShown = true;
      log('Oferta especial.','accent');
      log('"Peça de uso militar, fora de catálogo. A minha parte já foi dada." O vendedor desliza um Rifle Eletromagnético sobre o balcão, sem mais explicações.','accent');
    }
  }
  const LIMITED_STOCK = ['pistol','plated_vest','rifle'];
  function catalogFor(context){
    let base = Object.assign({}, SHOP_CATALOGS[context] || {});
    if(context==='market' && rifleUnlocked()){ base.rifle = RIFLE_PRICE; base.rifle_ammo = RIFLE_AMMO_PRICE; }
    LIMITED_STOCK.forEach(id=>{ if(state.shopPurchased[id]) delete base[id]; });
    return base;
  }

  /* ============================ STATE ============================ */
  let state;
  let activeChoiceButtons = [];
  let currentDrawerKey = null;

  function freshState(){
    return {
      mode:'select',
      className:null, perkKey:null, perk:null, perkDesc:null, gear:[],
      x:0, y:0,
      hp:10, maxHp:10, stress:0, maxStress:10, armor:0, baseArmor:0, melee:1, hack:1, ranged:0,
      ap:0, maxAp:0, credits:0,
      noise:0, maxNoise:10,
      loadMax:10,
      inventory:[],
      looted:{},
      npcTalkCount:{},
      npcDefeated:{},
      hackFails:{},
      hackAttempts:{},
      bribeAttempts:0,
      flags:{ cipher:false, elevatorUnlocked:false, aiTricked:false, keycard:false, objective:false, runner:false, vaultCleared:false, matrix:false, docHealUsed:false, descended:false, serverAccess:false, vaultAccess:false, rifleOfferShown:false, cloakHackerDealDone:false, sentryAlerted:false, sentryPursuit:null, sentryKills:0, sentryReinforcements:0, sentryCooldown:0, lastFledRoom:null },
      shopPurchased:{},

  /* ============================ LOG & CHOICES ============================ */
  function log(text, cls=''){
    const p = document.createElement('div');
    p.className = `line ${cls}`.trim();
    p.textContent = text;
    screen.appendChild(p);
    screen.scrollTop = screen.scrollHeight;
  }

  function lockChoices(){
    activeChoiceButtons.forEach(b=>{ b.disabled = true; b.classList.add('spent'); });
    activeChoiceButtons = [];
  }

  function presentChoices(list){
    lockChoices();
    if(!list || !list.length) return;
    const row = document.createElement('div');
    row.className = 'choices';
    list.forEach(opt=>{
      const b = document.createElement('button');
      b.className = 'chip';
      b.textContent = opt.label;
      b.onclick = () => runCommand(opt.cmd);
      row.appendChild(b);
      activeChoiceButtons.push(b);
    });
    screen.appendChild(row);
    screen.scrollTop = screen.scrollHeight;
  }

  /* ============================ INVENTORY ============================ */
  const BUY_QTY = { ammo:10, rifle_ammo:2 };
  function itemWeight(id, qty){
    if(id==='ammo') return Math.ceil(qty/20);
    if(id==='rifle_ammo') return Math.ceil(qty/10);
    return qty;
  }
  function addItem(id, qty=1){
    const ex = state.inventory.find(i=>i.id===id);
    const beforeQty = ex ? ex.qty : 0;
    const afterQty = beforeQty + qty;
    const deltaWeight = itemWeight(id, afterQty) - itemWeight(id, beforeQty);
    if(currentLoad() + deltaWeight > state.loadMax) return false;
    if(ex) ex.qty = afterQty; else state.inventory.push({id, qty});
    return true;
  }
  function removeItem(id, qty=1){
    const it = state.inventory.find(i=>i.id===id);
    if(!it || it.qty < qty) return false;
    it.qty -= qty;
    if(it.qty<=0) state.inventory = state.inventory.filter(i=>i.id!==id);
    return true;
  }
  function hasItem(id){ return state.inventory.some(i=>i.id===id && i.qty>0); }
  function currentLoad(){ return state.inventory.reduce((s,i)=>s+itemWeight(i.id,i.qty),0); }

  /* ============================ HUB ============================ */
  function currentRoom(){ return HUB[posKey(state.x,state.y)]; }
  function activeNpcs(room){ return (room.npc||[]).filter(id=>!state.npcDefeated[id] && !(id==='drone_sentry' && state.flags.sentryAlerted)); }
  function roomHackAlreadyDone(room){
    if(!room) return false;
    if(room.id==='vaultcorridor') return !!state.flags.serverAccess;
    if(room.id==='server') return !!(state.flags.cipher && state.flags.elevatorUnlocked);
    if(room.id==='security') return !!state.flags.vaultAccess;
    if(room.id==='vault') return !!state.flags.vaultCleared;
    return false;
  }
  function hubExits(x,y){
    const dirs = [];
    if(y>0) dirs.push('norte');
    if(y<2) dirs.push('sul');
    if(x<2) dirs.push('leste');
    if(x>0) dirs.push('oeste');
    if(x===0 && y===1) return dirs.filter(d=>d!=='sul');
    if(x===0 && y===2) return dirs.filter(d=>d!=='norte');
    if(x===1 && y===1) return dirs.filter(d=>d!=='leste');
    if(x===2 && y===1) return dirs.filter(d=>d!=='oeste');
    return dirs;
  }
  function normalizeDir(arg){
    const m = { norte:'norte', sul:'sul', leste:'leste', oeste:'oeste', n:'norte', s:'sul', e:'leste', o:'oeste' };
    return m[(arg||'').toLowerCase().trim()] || null;
  }

  function enterRoom(){
    const room = currentRoom();
    if(state.flags.lastFledRoom && state.flags.lastFledRoom !== posKey(state.x, state.y)){
      state.flags.lastFledRoom = null;
    }
    log(`\n[SETOR] ${room.name}`, 'accent');
    log(room.desc, 'sys');
    if(room.id==='vault' && !state.flags.vaultCleared){
      log('O cofre reconhece presença estranha. Use HACKEAR para tentar abrir, ou volte mais preparado.', 'warn');
    }
    roomEnterEvent(room);
  }

  function roomEnterEvent(room){
    if(state.gameOver || state.win || state.combat) return;
    if(room.id==='vaultcorridor' && unit01Hunting()){
      log('Um drone servo observa do portão ao fundo, em silêncio hostil. Ele não vai mais conversar.','warn');
    } else if(inSentryNet(room) && unit01Hunting()){
      log('Um ícone vermelho pisca num monitor da sala: a central do Archon K-9 ainda tem a Unidade 01 na sua trilha.','warn');
    } else if(inSentryNet(room) && corridorSentryDown() && state.flags.sentryReinforcements < SENTRY_MAX_REINFORCEMENTS && state.noise >= SENTRY_DISPATCH_NOISE){
      log('Uma câmera gira até você e trava: a central do Archon K-9 está reunindo outra sentinela para esta área.','warn');
    } else if(room.id==='vaultcorridor' && !state.flags.serverAccess){
      const r = Math.random();
      if(r<0.18){
        state.noise = clamp(state.noise+1,0,state.maxNoise);
        log('Uma câmera gira na sua direção e trava por um segundo de mais. Ruído +1.','warn');
        checkNoiseEscalation();
      } else if(r<0.32){
        unlockLore('corridor_log');
      }
    }
    if(room.id==='security' && !state.flags.vaultAccess){
      const r = Math.random();
      if(r<0.18){
        state.stress = clamp(state.stress+1,0,state.maxStress);
        log('O guarda encara você por tempo demais antes de voltar ao terminal. Estresse +1.','warn');
        checkStressOverload();
      } else if(r<0.32){
        unlockLore('security_log');
      }
    }
  }

  function look(){
    if(state.mode==='combat'){ log(`Foco no combate: ${state.combat.enemy.name}.`,'sys'); return; }
    if(state.mode==='dungeon'){
      log(`Você está em ${state.dungeon.floor}.${state.dungeon.roomIdx+1} :: ${DUNGEON_DESC[state.dungeon.currentType]}`,'sys');
      renderAll(); presentContextChoices();
      return;
    }
    const room = currentRoom();
    log(`[${room.name}] ${room.desc}`, 'sys');
    const npcNames = activeNpcs(room).map(id=>NPCS[id].name);
    log(`Presenças: ${npcNames.length ? npcNames.join(', ') : 'nenhuma'}`, 'sys');
    const visibleLoot = (room.loot||[]).filter(en=>!state.looted[`${state.x},${state.y}|${en.id}`])
      .map(en=> en.id==='credchip' ? 'créditos esquecidos' : ITEMS[en.id].name);
    log(`Itens visíveis: ${visibleLoot.length ? visibleLoot.join(', ') : 'nenhum'}`, 'sys');
    log(`Saídas: ${hubExits(state.x,state.y).map(d=>DIR_LABEL[d]).join(', ')}`, 'sys');
    renderAll();
    presentContextChoices();
  }

  function loot(){
    if(state.mode!=='hub'){ log('Nada para saquear agora.','warn'); return; }
    if(sentryPursuitTick('Uma sentinela surge exatamente quando você ia saquear o lugar — a central do Archon K-9 sabia onde você estava.')) return;
    if(emergeFledEnemy()) return;
    if(maybeDispatchSentry(currentRoom())) return;
    const room = currentRoom();
    let got = false;
    (room.loot||[]).forEach(entry=>{
      const k = `${state.x},${state.y}|${entry.id}`;
      if(state.looted[k]) return;
      if(entry.id==='cipher' && room.id==='server' && !state.flags.cipher){
        log('A Cifra de Rede está presa no núcleo lógico dos servidores — hackeie o sistema com sucesso antes de tentar recolhê-la.','warn');
        return;
      }
      if(entry.id==='credchip'){
        const c = rand(3,6);
        state.credits += c; state.looted[k]=true; got=true;
        log(`Encontrado: chip de créditos perdido (+${c} créditos).`,'good');
        return;
      }
      const ok = addItem(entry.id, entry.qty||1);
      if(ok){ state.looted[k]=true; got=true; log(`Coletado: ${ITEMS[entry.id].name}.`,'good'); }
      else log(`Carga cheia: ${ITEMS[entry.id].name} ficou para trás.`,'warn');
    });
    if(room.groundLoot && room.groundLoot.length){
      const remaining = [];
      room.groundLoot.forEach(entry=>{
        if(addItem(entry.id, entry.qty)){
          got = true;
          log(`Recolhido: ${ITEMS[entry.id].name}${entry.qty>1?` x${entry.qty}`:''}.`,'good');
        } else {
          remaining.push(entry);
        }
      });
      room.groundLoot = remaining;
    }
    if(!got) log('Nada novo para saquear aqui.','sys');
    renderAll();
    presentContextChoices();
  }

  function talk(idArg){
    if(state.mode!=='hub'){ log('Sem ninguém para conversar agora.','warn'); return; }
    const room = currentRoom();
    const npcs = activeNpcs(room);
    let id = idArg && npcs.includes(idArg) ? idArg : npcs[0];
    if(!id){ log('Não há ninguém aqui para conversar.','sys'); return; }
    const n = NPCS[id];
    if(id==='drone_sentry' && state.flags.serverAccess && !state.flags.sentryAlerted){
      state.flags.sentryAlerted = true;
      log('PROTOCOLO DE SEGURANÇA: scanning... suspeito + falha de segurança detectados!','bad');
      log(`${n.name} trava o foco em você. A violação na grade sul foi registrada — não há mais conversa possível.`,'bad');
      startCombat('sentryDrone','hub');
      return;
    }
    state.npcTalkCount[id] = (state.npcTalkCount[id]||0) + 1;
    const count = state.npcTalkCount[id];
    let line;
    if(n.suspicious && count>2 && n.suspiciousLines && n.suspiciousLines.length){
      line = n.suspiciousLines[Math.min(count-3, n.suspiciousLines.length-1)];
    } else {
      line = choice(n.lines);
    }
    log(`${n.name}: "${line}"`, 'accent');
    if(id==='doc' && !state.flags.docHealUsed && state.hp < state.maxHp){
      state.flags.docHealUsed = true;
      state.hp = clamp(state.hp+3,0,state.maxHp);
      log('Dra. Vale aplica um curativo de cortesia. HP +3.','good');
    }
    if(id==='fixer' && !state.flags.objective){
      log('Dica: o Datavault Omega está trancado por segurança. Hackeie a Antecâmara de Segurança para liberar o acesso até ele.','dim');
    }
    if(id==='drone_sentry' && !state.flags.serverAccess){
      log('Dica: a grade ao sul (Sala de Servidores) responde a uma intrusão bem-sucedida neste corredor.','dim');
    }
    if(id==='guard_npc' && !state.flags.vaultAccess){
      log('Dica: hackear esta antecâmara destrava o acesso ao Datavault Omega — ou, se preferir arriscar os créditos, tente subornar.','dim');
    }
    if(id==='kernel9' && !state.flags.elevatorUnlocked){
      if(!state.flags.cipher) log('Dica: HACKEAR aqui libera a Cifra de Rede guardada nos racks.','dim');
      else log('Dica: uma segunda intrusão bem-sucedida aqui destrava os elevadores de manutenção.','dim');
    }
    if(id==='ratking') unlockLore('ratking_secret');
    if(n.suspicious && count>=3 && !state.npcDefeated[id]){
      const chance = Math.min(0.6, 0.15*(count-2));
      if(Math.random()<chance){
        log(`${n.name} perde a paciência com sua insistência e parte para o ataque.`,'bad');
        startCombat(n.hostileEnemy, 'hub', { npcId:id });
        return;
      }
    }
    renderAll();
    presentContextChoices();
  }

  function move(dirArg){
    if(state.mode!=='hub'){ log('Movimento indisponível agora.','warn'); return; }
    const dir = normalizeDir(dirArg);
    if(!dir){ log('Direção inválida. Use norte, sul, leste ou oeste.','warn'); return; }
    if(!hubExits(state.x,state.y).includes(dir)){ log('Sem passagem nessa direção.','warn'); return; }
    const v = DIRS[dir];
    const nx = clamp(state.x+v[0],0,2);
    const ny = clamp(state.y+v[1],0,2);
    const targetRoom = HUB[posKey(nx,ny)];
    if(targetRoom.locked && !state.flags[targetRoom.lockFlag]){
      log(targetRoom.lockHint || 'Acesso bloqueado por segurança.','warn');
      return;
    }
    if(currentRoom().id==='vaultcorridor' && dir==='sul' && sentryInterferes()){
      log('A Sentinela-Drone se interpõe na passagem lateral e ataca antes que você alcance os servidores.','bad');
      startCombat('sentryDrone','hub');
      return;
    }
    if(state.ap<=0){ log('PA insuficiente. Descanse ou espere para recuperar.','warn'); return; }
    state.ap--;
    state.x = nx;
    state.y = ny;
    state.noise = clamp(state.noise+1,0,state.maxNoise);
    if(Math.random()<0.12){
      state.stress = clamp(state.stress+1,0,state.maxStress);
      log('A tensão do setor pesa. Estresse +1.','warn');
      checkStressOverload();
      if(state.combat){ renderAll(); return; }
    }
    enterRoom();
    if(!state.combat) sentryPursuitTick();
    if(!state.combat) randomAmbush();
    if(state.combat) return;
    checkNoiseEscalation();
    if(state.combat || state.gameOver) return;
    renderAll();
    presentContextChoices();
  }

  function scan(){
    state.noise = clamp(state.noise+1,0,state.maxNoise);
    if(state.mode==='dungeon'){
      log(`Varredura de setor: Nível ${state.dungeon.floor}/${state.dungeon.maxFloors}, Ruído ${state.noise}/${state.maxNoise}.`,'accent');
    } else {
      const room = currentRoom();
      log(`Varredura em ${room.name}. Ruído subiu para ${state.noise}.`,'accent');
      if(room.id==='server' && !state.flags.cipher) log('Leitura: vulnerabilidade lógica detectada. HACKEAR tem boas chances aqui.','warn');
      else if(room.id==='server' && !state.flags.elevatorUnlocked) log('Leitura: uma segunda camada de segurança protege os elevadores. HACKEAR novamente para rompê-la.','warn');
      else if(room.id==='vault' && !state.flags.vaultCleared) log('Leitura: núcleo de segurança instável. Algo dorme lá dentro.','bad');
      else log('Leitura: risco moderado. Nada além do óbvio.','sys');
    }
    checkNoiseEscalation();
    renderAll();
    if(!state.combat) presentContextChoices();
  }

  function predictEnemyMove(e){
    const hints = {
      bleed:'Sensores indicam um golpe cortante na próxima jogada — risco de sangramento mental.',
      alarm:'O inimigo prepara um sinal de alarme. Espere um pico de Ruído no próximo golpe.',
      noise:'Padrão de interferência detectado: a próxima ação deve gerar mais Ruído.',
      mindspike:'Frequência neural hostil detectada. O próximo golpe pode pesar mais no Estresse.',
      corrode:'Resíduo corrosivo nos atuadores: o próximo golpe deve ignorar parte da sua armadura.',
      lockdown:'Protocolo de bloqueio pronto para disparar — risco de perder a próxima ação.',
      phase:'Núcleo instável: se a fase final começar, o próximo golpe pode sobrecarregar.',
      swarm:'Padrão de enxame: o próximo ataque deve vir dividido em dois golpes.'
    };
    return hints[e.special] || 'Nenhum padrão crítico detectado — ataque convencional esperado.';
  }

  function combatScan(){
    if(!state.combat) return;
    const e = state.combat.enemy;
    const raw = rollD20();
    const total = raw + state.hack;
    const target = 12 + e.armor;
    log(`Varredura tática: ${raw}+${state.hack}=${total} vs DR ${target}`,'dim');
    if(raw===20){
      state.combat.hackVulnerable = true;
      state.combat.weakPointBonus = 2;
      log(`CRÍTICO: ${e.name} fica com um ponto cego exposto. Próxima ação ofensiva +2, e a próxima intrusão ignora a armadura dele.`,'good');
    } else if(total>=target){
      log(`Varredura bem-sucedida. ${predictEnemyMove(e)}`,'good');
      if(Math.random()<0.5){
        state.combat.weakPointBonus = 2;
        log('Um ponto fraco foi identificado. Próxima ação ofensiva +2.','accent');
      }
    } else {
      log('Varredura inconclusiva. O ruído do confronto encobre os sinais.','warn');
    }
    enemyTurn();
    if(state.gameOver) return;
    renderAll();
    presentContextChoices();
  }

  function hack(){
    if(state.combat) return combatAction('hack');
    if(state.mode==='dungeon'){
      if(!state.dungeon || state.dungeon.currentType!=='terminal' || state.dungeon.terminalHacked){
        log('Nada para hackear aqui.','warn');
        return;
      }
      if(state.ap<=0){ log('PA insuficiente para uma intrusão.','warn'); return; }
      state.ap--;
      state.dungeon.terminalHacked = true;
      const raw = rollD20();
      const total = raw + state.hack;
      const target = 11;
      log(`Intrusão: ${raw}+${state.hack}=${total} vs DR ${target}`,'sys');
      if(total>=target){
        log('Intrusão bem-sucedida. O terminal libera um cache protegido.','good');
        const drop = randomSupplyDrop();
        if(drop.ok) log(`Recuperado: ${ITEMS[drop.id].name}${drop.qty>1?` x${drop.qty}`:''}.`,'good');
        state.noise = clamp(state.noise-2,0,state.maxNoise);
      } else {
        log('Intrusão falhou. O terminal trava e dispara um alarme local.','bad');
        state.noise = clamp(state.noise+2,0,state.maxNoise);
        state.stress = clamp(state.stress+1,0,state.maxStress);
        checkStressOverload();
      }
      checkNoiseEscalation();
      if(state.combat) return;
      renderAll();
      presentContextChoices();
      return;
    }
    if(state.mode!=='hub'){ log('Nada para hackear aqui.','warn'); return; }
    const room = currentRoom();
    if(!room.hackable){ log('Nada digno de intrusão neste local.','warn'); return; }
    if(roomHackAlreadyDone(room)){ log('Este sistema já foi comprometido. Nada mais a hackear aqui.','sys'); return; }
    if(state.ap<=0){ log('PA insuficiente para uma intrusão.','warn'); return; }
    if(sentryInterferes()){
      log('A Sentinela-Drone ataca no meio da tentativa de intrusão.','bad');
      startCombat('sentryDrone','hub',{ unit:1 });
      return;
    }
    if(maybeDispatchSentry(room)) return;
    state.ap--;
    state.noise = clamp(state.noise+1,0,state.maxNoise);
    state.hackAttempts[room.id] = (state.hackAttempts[room.id]||0) + 1;
    const raw = rollD20();
    const total = raw + state.hack;
    let target = 14;
    if(room.id==='server') target = state.flags.cipher ? 13 : 12;
    if(room.id==='security') target = 13;
    if(room.id==='vaultcorridor') target = 11;
    if(room.id==='vault') target = state.flags.cipher ? 13 : 16;
    const fails = state.hackFails[room.id] || 0;
    target += Math.min(3, fails);
    log(`Intrusão: ${raw}+${state.hack}=${total} vs DR ${target}`,'sys');
    if(total>=target){
      state.hackFails[room.id] = 0;
      log('Intrusão bem-sucedida.','good');
      if(room.id==='server'){
        if(!state.flags.cipher){
          state.flags.cipher = true; state.flags.aiTricked = true;
          state.noise = clamp(state.noise-2,0,state.maxNoise);
          unlockLore('kernel_tricked');
          log('KERNEL-9 perde a desconfiança e libera a Cifra de Rede armazenada no rack local.','good');
          log('Os elevadores de manutenção ainda estão travados — uma segunda intrusão é necessária para reativá-los.','warn');
        } else {
          state.flags.elevatorUnlocked = true;
          log('Segunda camada de segurança rompida. Os elevadores de manutenção respondem novamente — acesso ao Núcleo K-9 liberado.','good');
        }
      } else if(room.id==='security'){
        state.flags.keycard = true;
        state.flags.vaultAccess = true;
        unlockLore('security_down');
        log('As travas da antecâmara caem. O guarda finge não ter visto nada. O acesso ao túnel para Datavault Omega está liberado.','good');
      } else if(room.id==='vaultcorridor'){
        state.flags.serverAccess = true;
        log('As câmeras do corredor entram em loop cego. A grade de segurança da Sala de Servidores se abre.','good');
      } else if(room.id==='vault'){
        openVault();
        return;
      }
    } else {
      state.hackFails[room.id] = fails + 1;
      log('Intrusão falhou. O sistema registra sua tentativa.','bad');
      state.stress = clamp(state.stress+1,0,state.maxStress);
      checkStressOverload();
      if(room.id==='vaultcorridor' || room.id==='security'){
        const npcId = activeNpcs(room)[0];
        const n = npcId && NPCS[npcId];
        if(n && n.hostileEnemy && !state.gameOver){
          const aggroChance = 0.25 + Math.min(0.35, 0.1*fails);
          if(Math.random()<aggroChance){
            log(`${n.name} detecta a intrusão falha e reage.`,'bad');
            startCombat(n.hostileEnemy, 'hub', { npcId });
            return;
          }
        }
      }
    }
    checkNoiseEscalation();
    if(state.combat) return;
    renderAll();
    presentContextChoices();
  }

  function openVault(){
    log('O Datavault Omega libera os lacres. Algo desperta lá dentro.','warn');
    startCombat('vaultSentinel','hub');
    if(state.flags.keycard){
      state.combat.enemy.armor = Math.max(0, state.combat.enemy.armor-1);
      log('Sem suporte de segurança ativo, a sentinela está mais vulnerável.','sys');
    }
  }

  function bribeGuard(){
    if(state.mode!=='hub'){ log('Sem ninguém para subornar agora.','warn'); return; }
    const room = currentRoom();
    if(room.id!=='security'){ log('Sem ninguém para subornar aqui.','warn'); return; }
    if(state.flags.vaultAccess){ log('Não há mais nada a negociar aqui.','sys'); return; }
    if(!activeNpcs(room).includes('guard_npc')){ log('Não há ninguém aqui para subornar.','sys'); return; }
    if(state.credits < BRIBE_PRICE){ log(`Suborno custaria ${BRIBE_PRICE} créditos. Você não tem o suficiente.`,'warn'); return; }
    state.bribeAttempts = (state.bribeAttempts||0) + 1;
    const attempts = state.bribeAttempts;
    const successChance = Math.max(0.2, 0.45 - 0.05*(attempts-1));
    const alertChance = Math.min(0.5, 0.25 + 0.08*(attempts-1));
    const r = Math.random();
    if(r < successChance){
      state.credits -= BRIBE_PRICE;
      state.flags.vaultAccess = true;
      state.flags.keycard = true;
      log(`Você desliza ${BRIBE_PRICE} créditos sobre o balcão. O guarda guarda o crédito sem fazer perguntas. "Não vi nada." O acesso ao Datavault Omega está liberado.`,'good');
    } else if(r < successChance + alertChance){
      state.credits -= BRIBE_PRICE;
      log(`O guarda pega os ${BRIBE_PRICE} créditos, olha para os dois lados — e aperta o rádio no ombro mesmo assim. "Tentativa de suborno, antecâmara." Reforços a caminho.`,'bad');
      state.noise = clamp(state.noise+3,0,state.maxNoise);
      checkNoiseEscalation();
    } else {
      log('O guarda recusa com um olhar cansado antes que você chegue a oferecer o valor todo. "Nem por isso. Tenta de outro jeito." Nada além disso acontece.','warn');
    }
    if(state.combat){ renderAll(); return; }
    renderAll();
    presentContextChoices();
  }

  function activeShopCatalog(){
    if(state.mode==='hub'){
      const room = currentRoom();
      if(room && room.shop) return catalogFor(room.shop);
    }
    return null;
  }

  function openShop(){
    const room = currentRoom();
    if(!room || !room.shop){ log('Sem comércio aqui.','warn'); return; }
    maybeAnnounceRifle(room.shop);
    const catalog = catalogFor(room.shop);
    log(room.shop==='market' ? 'O vendedor exibe a banca de sucata e equipamentos:' : 'A Dra. Vale aponta para o armário de suprimentos:', 'sys');
    const chips = Object.entries(catalog).map(([id,price])=>({ label:`Comprar ${ITEMS[id].name}${BUY_QTY[id]?` x${BUY_QTY[id]}`:''} (${price}cr)`, cmd:`comprar ${id}` }));
    chips.push({ label:'Fechar Loja', cmd:'look' });
    presentChoices(chips);
  }

  function buy(idArg){
    const catalog = activeShopCatalog();
    if(!catalog){ log('Sem comércio aqui.','warn'); return; }
    const id = ALIASES[(idArg||'').toLowerCase()] || (idArg||'').toLowerCase();
    const price = catalog[id];
    if(!price){ log('Esse item não está à venda aqui.','warn'); return; }
    if(state.credits < price){ log('Créditos insuficientes.','warn'); return; }
    const qty = BUY_QTY[id] || 1;
    if(!addItem(id,qty)){ log('Sem espaço de carga para esse item.','warn'); return; }
    state.credits -= price;
    if(LIMITED_STOCK.includes(id)) state.shopPurchased[id] = true;
    log(`Comprado: ${ITEMS[id].name}${qty>1?` x${qty}`:''} por ${price} créditos.${LIMITED_STOCK.includes(id)?' (peça única — estoque esgotado)':''}`,'good');
    renderAll();
    if(state.mode==='dungeon') presentContextChoices(); else openShop();
  }

  function dropItem(idArg){
    const id = ALIASES[(idArg||'').toLowerCase()] || (idArg||'').toLowerCase();
    if(!hasItem(id)){ log('Item não encontrado no inventário.','warn'); return; }
    removeItem(id,1);
    log(`Descartado: ${ITEMS[id] ? ITEMS[id].name : id}.`,'sys');
    renderAll();
    if(!state.combat) presentContextChoices();
  }

  function randomAmbush(){
    if(state.combat || state.gameOver || state.win) return;
    const room = currentRoom();
    if(maybeSentryEncounter(room)) return;
    const chance = room.ambush || 0;
    if(Math.random() < chance){
      let pool = room.enemyPool && room.enemyPool.length ? room.enemyPool.slice() : ['thug'];
      if(room.id==='security' && state.noise>=6) pool.push('guard_elite');
      if(room.id==='vaultcorridor' && state.noise>=6) pool.push('sentryDrone');
      // Depois da Unidade 01, só a central pode enviar novas sentinelas (maybeDispatchSentry).
      pool = sanitizeSentryPool(pool);
      if(!pool.length) pool = ['thug'];
      startCombat(choice(pool), 'hub');
    }
  }

  /* ============================ ITEM USE ============================ */
  function useItem(raw){
    if(!raw){ log('Use o quê? Especifique um item.','warn'); return; }
    const id = ALIASES[raw.toLowerCase().trim()] || raw.toLowerCase().trim();
    if(!hasItem(id)){ log(`Você não possui "${raw}".`,'warn'); return; }
    const inCombat = !!state.combat;
    switch(id){
      case 'stim':
        state.hp = clamp(state.hp+6,0,state.maxHp);
        removeItem('stim');
        log('Stim Patch aplicado. HP +6.','good');
        break;
      case 'battery':
        removeItem('battery');
        state.ap = clamp(state.ap+2,0,state.maxAp);
        log(`Célula de Bateria recarrega seus sistemas. PA +2.${inCombat ? ' Mesmo em combate, a reserva de intrusão responde.' : ''}`,'good');
        break;
      case 'smoke':
        removeItem('smoke');
        if(inCombat){
          state.combat.smokeActive = true;
          state.combatSmokeFleeBonus = true;
          log('Fumaça liberada no confronto. Próximo golpe reduzido e fuga facilitada.','good');
        } else {
          state.noise = clamp(state.noise-3,0,state.maxNoise);
          log('Fumaça dispersa sensores próximos. Ruído -3.','good');
        }
        break;
      case 'overclock':
        removeItem('overclock');
        state.overclockArmed = true;
        log('Overclock armado. Sua próxima ação ofensiva será rerrolada.','good');
        break;
      case 'armor_patch':
        state.hp = clamp(state.hp+3,0,state.maxHp);
        state.noise = clamp(state.noise-1,0,state.maxNoise);
        removeItem('armor_patch');
        log('Remendo aplicado. HP +3, Ruído -1.','good');
        break;
      case 'plated_vest':
        log('O colete já está vestido. O bônus de Armadura +1 é passivo enquanto você o carregar.','sys');
        return;
      case 'shiv':
        log('A lâmina já está pronta na manga. O bônus é passivo enquanto você a carregar.','sys');
        return;
      case 'pistol':
        log('A pistola já está em punho. Use DISPARAR em combate para atirar.','sys');
        return;
      case 'rifle':
        log('O rifle já está pronto no ombro. Use DISPARAR em combate para atirar. Ranged +1 enquanto equipado.','sys');
        return;
      case 'rifle_ammo':
        log('O projétil ferromagnético é carregado automaticamente ao disparar o Rifle Eletromagnético.','sys');
        return;
      case 'cloak':
        log('A Capa Termo-óptica já está vestida. O efeito é automático ao entrar em combate.','sys');
        return;
      case 'ammo':
        log('Munição é consumida automaticamente ao disparar em combate.','sys');
        return;
      case 'cipher':
        if(inCombat && state.combat){
          removeItem('cipher');
          state.combat.enemy.hp = clamp(state.combat.enemy.hp-4,0,state.combat.enemy.maxHp);
          log('A Cifra interfere no núcleo hostil. 4 de dano verdadeiro.','good');
          if(state.combat.enemy.hp<=0){ endCombat(); return; }
        } else if(state.mode==='hub' && posKey(state.x,state.y)==='2,1'){
          if(!state.flags.elevatorUnlocked){
            removeItem('cipher');
            state.flags.elevatorUnlocked = true;
            state.noise = clamp(state.noise-2,0,state.maxNoise);
            log('Segunda Cifra implantada. A segunda camada de segurança cai — os elevadores de manutenção respondem novamente. Acesso ao Núcleo K-9 liberado.','good');
          } else {
            log('Este sistema já foi comprometido. A Cifra não encontra mais uso aqui.','warn');
          }
        } else {
          log('A Cifra não encontra uma tomada lógica aqui.','warn');
        }
        break;
      default:
        log('Item sem efeito programado.','warn');
    }
    checkStressOverload();
    checkNoiseEscalation();
    if(state.gameOver) return;
    if(state.combat){ enemyTurn(); if(state.gameOver) return; }
    renderAll();
    presentContextChoices();
  }

  function quickUse(){
    const order = ['stim','armor_patch','battery','smoke','overclock','cipher'];
    const found = order.find(id=>hasItem(id));
    if(!found){ log('Nenhum item útil disponível agora.','warn'); return; }
    useItem(found);
  }

  /* ============================ REST / WAIT ============================ */
  function rest(){
    if(state.mode==='combat'){ log('Sem descanso possível em combate.','warn'); return; }
    if(sentryPursuitTick('A sentinela te alcança antes que você consiga se acomodar — a central do Archon K-9 não desistiu da caçada.')) return;
    if(emergeFledEnemy()) return;
    const noiseDie = rand(1,6);
    const restFailed = (state.mode==='hub' || state.mode==='dungeon') && noiseDie>=4;

    const hpGain  = restFailed ? 1 : 2;
    const apGain  = restFailed ? Math.ceil(state.maxAp/2) : state.maxAp;
    const stGain  = restFailed ? 0 : 2;

    state.hp     = clamp(state.hp + hpGain, 0, state.maxHp);
    state.stress = clamp(state.stress - stGain, 0, state.maxStress);

    if(state.mode==='hub' || state.mode==='dungeon'){
      state.ap = clamp(state.ap + apGain, 0, state.maxAp);
      if(restFailed){
        const noiseGain  = rand(1,3);
        const stressGain = rand(1,2);
        state.noise  = clamp(state.noise  + noiseGain,  0, state.maxNoise);
        state.stress = clamp(state.stress + stressGain, 0, state.maxStress);
        const msgs = {
          4: 'Barulho fora do controle durante o descanso.',
          5: 'Um ruído involuntário vaza pelo distrito.',
          6: 'Você sente estar sendo observado. E o pior, pode não ser paranoia.'
        };
        log(`${msgs[noiseDie]} Ruído +${noiseGain}, Estresse +${stressGain}. HP +${hpGain}, PA +${apGain}.`,'warn');
        checkStressOverload();
      } else {
        if(state.mode==='hub') passiveNoiseEffect();
        else { state.noise = clamp(state.noise+1,0,state.maxNoise); log('Pausa no núcleo. Ruído +1.','dim'); }
        log(`Pausa tática. HP +${hpGain}, Estresse -${stGain}. PA restaurado.`,'sys');
      }
    } else {
      log(`Pausa tática. HP +${hpGain}${stGain>0?`, Estresse -${stGain}`:''}.`,'sys');
    }
    randomDowntimeEvent();
    checkNoiseEscalation();
    if(state.combat || state.gameOver) return;
    renderAll();
    presentContextChoices();
  }

  function waitTurn(){
    if(state.mode==='combat'){ log('Não é possível esperar em combate. Escolha uma ação.','warn'); return; }
    if(sentryPursuitTick('A sentinela te alcança enquanto você tenta ganhar tempo — a central do Archon K-9 estava guiando cada passo dela.')) return;
    if(emergeFledEnemy()) return;
    if(state.mode==='hub' || state.mode==='dungeon'){
      state.ap = state.maxAp;
      if(state.mode==='hub') passiveNoiseEffect();
      else { state.noise = clamp(state.noise+1,0,state.maxNoise); log('Pausa no núcleo. Ruído +1.','dim'); }
    }
    log('Você deixa o relógio correr. O distrito não se importa.','sys');
    randomDowntimeEvent();
    checkNoiseEscalation();
    if(state.combat || state.gameOver) return;
    renderAll();
    presentContextChoices();
  }

  const NOISE_CALM_ROOMS   = ['safehub','market','drain'];
  const NOISE_STABLE_ROOMS = ['clinic','alley'];

  function emergeFledEnemy(){
    if(state.mode!=='hub') return false;
    const room = currentRoom();
    if(!room) return false;
    const isSentryRoom = inSentryNet(room) && unit01Hunting();
    const isFleeRoom = state.flags.lastFledRoom === posKey(state.x, state.y);
    if(isSentryRoom){
      const roll = rand(1,6) + effectiveRanged();
      if(roll<=4){
        log(room.id==='vaultcorridor'
          ? 'A Sentinela-Drone emerge do portão ao fundo do corredor.'
          : `${sentryUnitLabel(1)} emerge dos dutos de manutenção de ${room.name}, guiada pela central do Archon K-9.`,'bad');
        startCombat('sentryDrone','hub',{ unit:1 });
        return true;
      }
    }
    if(isFleeRoom && !isSentryRoom){
      const pool = room.enemyPool && room.enemyPool.length ? room.enemyPool.filter(e=>e!=='sentryDrone') : ['thug'];
      if(Math.random()<0.35){
        const key = choice(pool);
        log(`Algo ainda estava esperando — ${ENEMIES[key].name} reaparece.`,'bad');
        startCombat(key,'hub');
        return true;
      }
    }
    return false;
  }

  function passiveNoiseEffect(){
    if(state.mode!=='hub') return;
    const room = currentRoom();
    if(!room) return;
    if(NOISE_CALM_ROOMS.includes(room.id) && state.noise>0){
      state.noise = clamp(state.noise-1,0,state.maxNoise);
      log('O ambiente dissolve a tensão passivamente. Ruído -1.','dim');
    } else if(NOISE_STABLE_ROOMS.includes(room.id)){
      /* ruído não aumenta nem diminui automaticamente nessas salas */
    }
  }

  function randomDowntimeEvent(){
    // Esperar/descansar na malha de segurança também atrai a central (reforços mais rápidos).
    if(state.mode==='hub' && maybeDispatchSentry(currentRoom())) return;
    if(Math.random()<0.2){
      const r = rand(1,3);
      if(r===1){
        const room = state.mode==='hub' ? currentRoom() : null;
        const pool = room && room.enemyPool && room.enemyPool.length ? sanitizeSentryPool(room.enemyPool.slice()) : [];
        if(pool.length){
          const enemyKey = choice(pool);
          log(`Movimento abrupto no corredor — ${ENEMIES[enemyKey].name} entra em cena.`,'bad');
          startCombat(enemyKey, state.mode==='dungeon' ? 'dungeon' : 'hub');
        } else {
          log('Silêncio operacional. Raro, e por isso suspeito.','dim');
        }
      }
      else if(r===2){ state.stress = clamp(state.stress+1,0,state.maxStress); log('Um ruído distante eleva o nervosismo.','warn'); checkStressOverload(); }
      else log('Silêncio operacional. Raro, e por isso suspeito.','dim');
    }
  }

  /* ============================ COMBAT ============================ */
  function startCombat(enemyKey, returnTo, meta){
    // Salvaguarda: nenhum caminho pode recriar a Unidade 01 depois que ela foi destruída.
    if(enemyKey==='sentryDrone' && corridorSentryDown() && !(meta && meta.unit>1)) enemyKey = 'drone';
    const base = ENEMIES[enemyKey];
    const scale = returnTo==='dungeon' && state.dungeon ? (state.dungeon.floor-1) : 0;
    const enemy = {
      key:enemyKey, name:base.name,
      hp: base.hp+scale, maxHp: base.hp+scale,
      atk: base.atk + Math.floor(scale/2),
      armor: base.armor + (scale>3?1:0),
      credit:[base.credit[0]+scale, base.credit[1]+scale],
      special: base.special, synthetic: !!base.synthetic, boss: !!base.boss, rareDrop: !!base.rareDrop,
      phase: base.boss ? 1 : undefined,
      stunned:false
    };
    if(enemyKey==='sentryDrone'){
      enemy.unit = (meta && meta.unit) || 1;
      if(enemy.unit > 1){
        enemy.name = sentryUnitLabel(enemy.unit);
        enemy.atk += 1;
      } else if(!state.flags.sentryAlerted){
        state.flags.sentryAlerted = true;
        log('A Sentinela-Drone do Corredor emerge em definitivo do portão ao fundo do corredor. Não há mais conversa possível com ela.','bad');
      } else {
        enemy.atk += 1;
      }
    }
    state.combat = {
      enemy, returnTo, playerStunned:false,
      machinePrayerUsed:false, coldBootUsed:false, ghostStepUsed:false, smokeActive:false,
      cloakActive:false, firstActionDone:false, weakPointBonus:0, hackVulnerable:false,
      npcId: (meta && meta.npcId) || null
    };
    state.mode = 'combat';
    log(`\n>> CONTATO HOSTIL: ${enemy.name} <<`,'bad');
    if(hasItem('cloak')){
      const detected = (enemy.synthetic || enemy.boss) && Math.random()<0.5;
      state.combat.cloakActive = !detected;
      log(detected
        ? 'Sensores avançados perfuram sua Capa Termo-óptica. Camuflagem comprometida nesta luta.'
        : 'Capa Termo-óptica ativa. Você se move como ruído de fundo.', detected ? 'warn' : 'accent');
    }
    const initDie = rand(1,6);
    const initTotal = initDie + effectiveRanged();
    if(initTotal<=4){
      log(`Iniciativa: ${initDie}+${effectiveRanged()}=${initTotal} (≤4) — ${enemy.name} reage primeiro!`,'bad');
      renderAll();
      enemyTurn();
      if(state.gameOver) return;
    } else {
      log(`Iniciativa: ${initDie}+${effectiveRanged()}=${initTotal} — você reage primeiro.`,'good');
    }
    renderAll();
    presentContextChoices();
  }

  function sentryInterferes(){
    if(!state.flags.sentryAlerted || state.npcDefeated['drone_sentry']) return false;
    const room = currentRoom();
    if(!inSentryNet(room)) return false;
    const roll = rand(1,6) + effectiveRanged();
    return roll<=4;
  }

  function combatAction(kind){
    if(!state.combat){ log('Sem combate ativo.','warn'); return; }
    if(state.combat.playerStunned){
      state.combat.playerStunned = false;
      log('Seus controles ainda estão travados. Você perde a ação.','warn');
      enemyTurn();
      if(state.gameOver) return;
      renderAll();
      presentContextChoices();
      return;
    }
    if(kind==='attack' || kind==='hack') return resolvePlayerAction(kind);
    if(kind==='ranged') return hasItem('rifle') ? resolveRifleAttack() : resolveRangedAttack();
    if(kind==='flee') return doFlee();
    if(kind==='scan') return combatScan();
  }

  function resolveRangedAttack(){
    const e = state.combat.enemy;
    if(!hasItem('pistol')){ log('Você não está portando uma arma de longo alcance.','warn'); return; }
    const ammoStack = state.inventory.find(i=>i.id==='ammo');
    const available = ammoStack ? ammoStack.qty : 0;
    if(available<=0){ log('Sem munição para disparar.','warn'); return; }

    const jamRoll = rand(1,6);
    if(jamRoll===1){
      log('Disparo: rolagem 1 no d6 — a arma trava na câmara.','bad');
      state.noise = clamp(state.noise+1,0,state.maxNoise);
      checkNoiseEscalation();
      if(state.combat){
        enemyTurn();
        if(state.gameOver) return;
      }
      renderAll();
      presentContextChoices();
      return;
    }
    const shotsIntended = jamRoll - 1;
    const shotsFired = Math.min(shotsIntended, available);
    log(`Disparo: rolagem ${jamRoll} no d6 — ${shotsIntended} disparo${shotsIntended>1?'s':''} na câmara.`,'dim');
    if(shotsFired < shotsIntended){
      log(`Munição insuficiente para a rajada completa: apenas ${shotsFired} de ${shotsIntended} cartuchos disponíveis.`,'warn');
    }
    removeItem('ammo', shotsFired);

    let mod = effectiveRanged();
    if(state.shaken){ mod -= 1; state.shaken = false; log('Tremor residual: -1 nesta rajada.','dim'); }
    if(state.combat.weakPointBonus){
      mod += state.combat.weakPointBonus;
      log(`Ponto fraco explorado: +${state.combat.weakPointBonus} nesta rajada.`,'accent');
      state.combat.weakPointBonus = 0;
    }
    const isSurprise = state.combat.cloakActive && !state.combat.firstActionDone;
    state.combat.firstActionDone = true;
    const target = 12 + e.armor;

    let hits = 0, totalDmg = 0;
    for(let i=0;i<shotsFired;i++){
      let raw = rollD20();
      if(state.overclockArmed){
        const raw2 = rollD20();
        log(`Overclock no disparo ${i+1}: ${raw} → rerrolado ${raw2}.`,'sys');
        raw = Math.max(raw, raw2);
        state.overclockArmed = false;
      }
      const total = raw + mod;
      if(total>=target){
        let dmg = roll(3, Math.max(0, Math.floor(mod/2)));
        if(raw===20){ dmg*=2; log(`Disparo ${i+1}/${shotsFired}: ${raw}+${mod}=${total} vs DR ${target} — CRÍTICO, ${dmg} de dano.`,'good'); }
        else log(`Disparo ${i+1}/${shotsFired}: ${raw}+${mod}=${total} vs DR ${target} — acerto, ${dmg} de dano.`,'good');
        hits++; totalDmg += dmg;
      } else {
        log(`Disparo ${i+1}/${shotsFired}: ${raw}+${mod}=${total} vs DR ${target} — erra o alvo.`,'warn');
      }
    }

    if(hits>0){
      if(isSurprise){
        totalDmg = Math.max(hits, totalDmg) + 3;
        log('Ataque surpresa sob a Capa Termo-óptica: o alvo não reage a tempo. Armadura ignorada nesta rajada, +3 de dano.','accent');
      } else {
        totalDmg = Math.max(hits, totalDmg - e.armor);
      }
      e.hp = clamp(e.hp-totalDmg,0,e.maxHp);
      log(`Rajada conclui: ${hits}/${shotsFired} acerto(s), ${totalDmg} de dano total em ${e.name}. (${Math.max(e.hp,0)}/${e.maxHp})`,'good');
    } else {
      log('Nenhum disparo da rajada conectou.','warn');
    }

    const noiseGain = Math.min(3, 1 + Math.ceil(shotsFired/2));
    state.noise = clamp(state.noise + noiseGain, 0, state.maxNoise);

    if(e.hp<=0){ return endCombat(); }
    finishPlayerTurn();
  }

  function resolveRifleAttack(){
    const e = state.combat.enemy;
    if(!hasItem('rifle')){ log('Você não está portando o Rifle Eletromagnético.','warn'); return; }
    const ammoStack = state.inventory.find(i=>i.id==='rifle_ammo');
    const available = ammoStack ? ammoStack.qty : 0;
    if(available<=0){ log('Sem projéteis .50 para disparar.','warn'); return; }

    let mod = effectiveRanged();
    if(state.shaken){ mod -= 1; state.shaken = false; log('Tremor residual: -1 neste disparo.','dim'); }
    if(state.combat.weakPointBonus){
      mod += state.combat.weakPointBonus;
      log(`Ponto fraco explorado: +${state.combat.weakPointBonus} neste disparo.`,'accent');
      state.combat.weakPointBonus = 0;
    }
    const isSurprise = state.combat.cloakActive && !state.combat.firstActionDone;
    state.combat.firstActionDone = true;

    let raw = roll(8,0);
    if(state.overclockArmed){
      const raw2 = roll(8,0);
      log(`Overclock no disparo: ${raw} → rerrolado ${raw2}.`,'sys');
      raw = Math.max(raw, raw2);
      state.overclockArmed = false;
    }
    const sum = raw + mod;

    if(sum<=5){
      removeItem('rifle_ammo',1);
      log(`Disparo do rifle: d8 ${raw}+${mod}=${sum} — o disparo erra o alvo.`,'warn');
      state.noise = clamp(state.noise+1,0,state.maxNoise);
      if(e.hp<=0){ return endCombat(); }
      return finishPlayerTurn();
    }
    if(sum===6){
      log(`Disparo do rifle: d8 ${raw}+${mod}=${sum} — a arma falha e o disparo é cancelado (projétil poupado).`,'warn');
      if(e.hp<=0){ return endCombat(); }
      return finishPlayerTurn();
    }

    removeItem('rifle_ammo',1);
    const isCrit = sum>=8;
    let dmg = 2 * sum;
    if(isCrit) dmg *= 2;
    if(isSurprise){
      dmg += 3;
      dmg = Math.max(1, dmg);
      log('Ataque surpresa sob a Capa Termo-óptica: o alvo não reage a tempo. Armadura ignorada neste disparo, +3 de dano.','accent');
    } else {
      dmg = Math.max(1, dmg - e.armor);
    }
    e.hp = clamp(e.hp-dmg,0,e.maxHp);
    log(`Disparo do rifle: d8 ${raw}+${mod}=${sum} — ${isCrit?'CRÍTICO (dano dobrado)':'acerto'}, ${dmg} de dano em ${e.name}. (${Math.max(e.hp,0)}/${e.maxHp})`,'good');
    state.noise = clamp(state.noise + 2, 0, state.maxNoise);
    if(e.hp<=0){ return endCombat(); }
    finishPlayerTurn();
  }

  function resolvePlayerAction(kind){
    const e = state.combat.enemy;
    if(kind==='hack'){
      if(state.ap<=0){ log('PA insuficiente para hackear em combate. A intrusão exige reserva mental livre — descanse fora de combate para recuperar.','warn'); return; }
      state.ap--;
    }
    let mod = kind==='attack' ? state.melee + (hasItem('shiv')?1:0) : state.hack;
    if(state.shaken){ mod -= 1; state.shaken = false; log('Tremor residual: -1 nesta ação.','dim'); }
    if(state.combat.weakPointBonus){
      mod += state.combat.weakPointBonus;
      log(`Ponto fraco explorado: +${state.combat.weakPointBonus} nesta ação.`,'accent');
      state.combat.weakPointBonus = 0;
    }
    let ignoreArmorThisHit = false;
    if(kind==='hack' && state.combat.hackVulnerable){
      mod += 4; ignoreArmorThisHit = true; state.combat.hackVulnerable = false;
      log('Vulnerabilidade explorada: a intrusão ignora a armadura do alvo.','accent');
    }
    if(kind==='attack' && state.perkKey==='chrome' && !state.combat.machinePrayerUsed){
      mod += 2; state.stress = clamp(state.stress-1,0,state.maxStress); state.combat.machinePrayerUsed = true;
      log('Oração de Máquina: +2 no ataque, Estresse -1.','accent');
    }
    if(kind==='hack' && state.perkKey==='magus' && !state.combat.coldBootUsed){
      mod += 3; state.combat.coldBootUsed = true;
      log('Cold Boot: +3 na primeira intrusão deste combate.','accent');
    }

    const isSurprise = state.combat.cloakActive && !state.combat.firstActionDone;
    state.combat.firstActionDone = true;

    let raw = rollD20();
    if(state.overclockArmed){
      const raw2 = rollD20();
      log(`Overclock: ${raw} → rerrolado ${raw2}.`,'sys');
      raw = Math.max(raw, raw2);
      state.overclockArmed = false;
    }
    if(raw===1){
      state.stress = clamp(state.stress+1,0,state.maxStress);
      log('Falha crítica. O sistema vira contra você.','bad');
      checkStressOverload();
      return finishPlayerTurn();
    }
    const total = raw + mod;
    const target = 12 + (ignoreArmorThisHit ? 0 : e.armor);
    const kindLabel = kind==='attack' ? 'Ataque' : 'Intrusão';
    log(`${kindLabel}: ${raw}+${mod}=${total} vs DR ${target}`,'dim');
    if(total>=target){
      let dmg = kind==='attack' ? roll(4, state.melee) : roll(3, state.hack);
      if(raw===20){ dmg*=2; log('CRÍTICO! Dano dobrado.','good'); }
      if(kind==='hack' && e.synthetic && hasItem('cipher')){
        removeItem('cipher'); dmg += 4;
        log('Cifra de Rede amplifica a intrusão (+4 dano verdadeiro).','good');
      }
      if(kind==='attack'){
        dmg = isSurprise ? Math.max(1, dmg) : Math.max(1, dmg - e.armor);
      }
      if(isSurprise){
        dmg += 3;
        log(kind==='attack'
          ? 'Ataque surpresa sob a Capa Termo-óptica: o alvo não reage a tempo. Armadura ignorada neste golpe, +3 de dano.'
          : 'Ataque surpresa sob a Capa Termo-óptica: +3 de dano.', 'accent');
      }
      e.hp = clamp(e.hp-dmg,0,e.maxHp);
      log(`${kindLabel} acerta ${e.name} por ${dmg} de dano. (${Math.max(e.hp,0)}/${e.maxHp})`,'good');
      if(kind==='hack' && e.hp>0 && Math.random()<0.2){
        e.stunned = true;
        log(`${e.name} sofre interferência e perde o próximo turno.`,'warn');
      }
      const noiseGain = kind==='attack' && hasItem('shiv') ? 0 : 1;
      state.noise = clamp(state.noise + noiseGain, 0, state.maxNoise);
      if(e.hp<=0){ return endCombat(); }
    } else {
      log(`${kindLabel} falha.`,'warn');
      state.noise = clamp(state.noise + 1, 0, state.maxNoise);
    }
    finishPlayerTurn();
  }

  function finishPlayerTurn(){
    checkNoiseEscalation();
    if(state.gameOver || state.win || !state.combat){ renderAll(); if(!state.combat) presentContextChoices(); return; }
    enemyTurn();
    if(state.gameOver || state.win) return;
    renderAll();
    presentContextChoices();
  }

  function doFlee(){
    if(!state.combat) return;
    let chance = 0.4;
    if(state.combatSmokeFleeBonus){ chance += 0.25; state.combatSmokeFleeBonus = false; }
    if(state.combat.cloakActive){ chance += 0.25; log('A Capa Termo-óptica facilita o desaparecimento.','accent'); }
    if(state.perkKey==='runner' && !state.combat.ghostStepUsed){
      state.combat.ghostStepUsed = true; chance = 1;
      log('Perk Passo Fantasma: fuga garantida nesta tentativa.','accent');
    }
    const r = Math.random();
    log(`Tentativa de fuga: ${Math.round(Math.min(chance,1)*100)}% de chance.`,'dim');
    if(r<chance){
      log('Você escapa pelos cabos e pelas sombras.','good');
      const returnTo = state.combat.returnTo;
      const fledEnemy = state.combat.enemy;
      const fledEnemyKey = fledEnemy.key;
      const fledRoomKey = posKey(state.x, state.y);
      state.combat = null;
      state.noise = clamp(state.noise+1,0,state.maxNoise);
      state.mode = returnTo==='dungeon' ? 'dungeon' : 'hub';
      if(fledEnemyKey==='sentryDrone'){
        const fledUnit = fledEnemy.unit || 1;
        state.flags.sentryPursuit = { ticks:SENTRY_PURSUIT_TICKS, unit:fledUnit };
        log(`${sentryUnitLabel(fledUnit)} transmite sua posição à central do Archon K-9 e mantém o rastreio.`,'warn');
      }
      state.flags.lastFledRoom = fledRoomKey;
      checkNoiseEscalation();
      renderAll();
      if(!state.combat) presentContextChoices();
    } else {
      log('Fuga bloqueada.','bad');
      state.noise = clamp(state.noise+1,0,state.maxNoise);
      enemyTurn();
      if(state.gameOver) return;
      renderAll();
      presentContextChoices();
    }
  }

  function resolveSingleHit(rawDmg, name, ignoreArmor){
