    let dmg = ignoreArmor ? Math.max(1,rawDmg) : Math.max(1, rawDmg-effectiveArmor());
    if(state.combat && state.combat.smokeActive){ dmg = Math.max(0, dmg-2); state.combat.smokeActive = false; log('Fumaça residual absorve parte do golpe.','sys'); }
    state.hp = clamp(state.hp-dmg,0,state.maxHp);
    log(`${name} acerta por ${dmg}.`,'bad');
    if(state.hp<=0){ state.hp = 0; gameOver(`${name} encerra sua corrida aqui.`); }
  }

  function enemyTurn(){
    if(!state.combat) return;
    const e = state.combat.enemy;
    if(e.stunned){ e.stunned = false; log(`${e.name} está sobrecarregado e perde o turno.`,'good'); renderAll(); return; }
    if(e.boss && e.phase===1 && e.hp<=Math.floor(e.maxHp/2)){
      e.phase = 2; e.atk += 1;
      log(`${e.name} entra em FASE 2: padrões de ataque mais agressivos.`,'bad');
    }
    let extraNoise = 0, extraStress = 0;
    switch(e.special){
      case 'bleed': if(Math.random()<0.3) extraStress = 1; break;
      case 'alarm': if(Math.random()<0.3) extraNoise = 2; break;
      case 'noise': if(Math.random()<0.4) extraNoise = 1; break;
      case 'mindspike': extraStress = 1; break;
      case 'lockdown': if(Math.random()<0.25){ state.combat.playerStunned = true; log(`${e.name} trava seus controles por um instante.`,'warn'); } break;
    }
    const hitRoll = rollD20();
    const hitMod = e.atk;
    const hitTotal = hitRoll + hitMod;
    const hitTarget = 10 + effectiveRanged();
    log(`${e.name} ataca: ${hitRoll}+${hitMod}=${hitTotal} vs DR ${hitTarget}`,'dim');
    if(hitTotal < hitTarget){
      log(`${e.name} erra o golpe.`,'sys');
    } else {
      let dmg = e.atk + rand(-1,1);
      let ignoreArmor = false;
      if(e.special==='corrode'){ dmg += 2; ignoreArmor = true; }
      if(e.special==='phase' && e.phase===2 && Math.random()<0.25){ dmg*=2; log('Sobrecarga do núcleo: dano duplicado.','bad'); }
      if(hitRoll===20){ dmg = Math.ceil(dmg*1.5); log(`${e.name} acerta em cheio — golpe crítico.`,'bad'); }
      if(e.special==='swarm'){
        const half = Math.max(1, Math.floor(dmg/2));
        resolveSingleHit(half, e.name, false);
        if(!state.gameOver) resolveSingleHit(half, e.name, false);
      } else {
        resolveSingleHit(dmg, e.name, ignoreArmor);
      }
    }
    if(state.gameOver) return;
    if(extraNoise){ state.noise = clamp(state.noise+extraNoise,0,state.maxNoise); log(`Ruído +${extraNoise}.`,'warn'); }
    if(extraStress){ state.stress = clamp(state.stress+extraStress,0,state.maxStress); log(`Estresse +${extraStress}.`,'warn'); checkStressOverload(); }
    renderAll();
  }

  function endCombat(){
    if(!state.combat) return;
    const e = state.combat.enemy;
    const returnTo = state.combat.returnTo;
    const npcId = state.combat.npcId;
    state.combat = null;
    log(`${e.name} neutralizado.`,'good');
    const cred = rand(e.credit[0], e.credit[1]);
    state.credits += cred;
    log(`Saque: +${cred} créditos.`,'good');
    if(!e.boss && Math.random()<0.35){
      const drop = randomSupplyDrop();
      if(drop.ok) log(`Encontrado: ${ITEMS[drop.id].name}${drop.qty>1?` x${drop.qty}`:''}.`,'good');
      else dropToGround(drop.id, drop.qty);
    }
    if((e.key==='guard' || e.key==='response') && !hasItem('pistol') && Math.random()<0.2){
      if(addItem('pistol',1)) log('Loot: Pistola Automática recuperada do inimigo.','good');
      else dropToGround('pistol',1);
    }
    if(e.rareDrop && Math.random()<0.3){
      const rare = choice(['plated_vest','cloak']);
      if(addItem(rare,1)) log(`Loot raro: ${ITEMS[rare].name}.`,'good');
      else dropToGround(rare,1);
    }
    state.stress = clamp(state.stress-1,0,state.maxStress);

    if(e.key==='sentryDrone') resolveSentryDown(e);

    if(npcId && NPCS[npcId]){
      state.npcDefeated[npcId] = true;
      const grantFlag = NPCS[npcId].grantsFlag;
      if(grantFlag && !state.flags[grantFlag]){
        state.flags[grantFlag] = true;
        log(`${NPCS[npcId].name} não vai mais incomodar você aqui. O caminho que ele guardava está livre.`,'accent');
      }
      if(npcId==='guard_npc' && !state.flags.keycard){
        state.flags.keycard = true;
        log('Você recolhe o crachá de acesso do guarda.','sys');
      }
    }

    if(e.key==='vaultSentinel'){
      state.flags.objective = true; state.flags.runner = true; state.flags.vaultCleared = true;
      unlockLore('vault_open');
      log('O cofre cede. Você recupera o Chip Omega e liberta o runner capturado.','accent');
    }
    if(e.key==='response'){
      state.noise = clamp(state.noise-6,0,state.maxNoise);
      log('A pressão cai. Ruído drasticamente reduzido.','good');
    }
    if(e.key==='archon'){
      state.flags.matrix = true;
      unlockLore('archon_fall');
      log('O Núcleo K-9 entra em colapso. A matriz de dados pulsa em suas mãos.','accent');
      ascendFromDungeon();
      renderAll();
      presentContextChoices();
      return;
    }

    if(state.pendingLockdown){
      state.pendingLockdown = false;
      state.mode = returnTo==='dungeon' ? 'dungeon' : 'hub';
      renderAll();
      triggerLockdown();
      return;
    }

    state.mode = returnTo==='dungeon' ? 'dungeon' : 'hub';
    renderAll();
    presentContextChoices();
  }

  function checkStressOverload(){
    if(state.gameOver || state.win) return;
    if(state.stress < state.maxStress) return;
    if(state.combat){
      log('SOBRECARGA NEURAL: você perde a próxima ação. Estresse parcialmente drenado pelo choque.','bad');
      state.combat.playerStunned = true;
      state.stress = Math.floor(state.maxStress*0.7);
    } else {
      log('COLAPSO NERVOSO: a mente trava por um instante.','bad');
      const r = rand(1,3);
      if(r===1 && state.inventory.length){
        const victim = choice(state.inventory);
        removeItem(victim.id,1);
        log(`Você derruba e perde: ${ITEMS[victim.id].name}.`,'warn');
      } else if(r===2){
        state.noise = clamp(state.noise+2,0,state.maxNoise);
        log('Reage mal ao ambiente. Ruído +2.','warn');
      } else {
        state.shaken = true;
        log('Um tremor seguirá você para o próximo confronto (-1 na primeira ação).','warn');
      }
      state.stress = Math.floor(state.maxStress*0.6);
    }
  }

  function checkNoiseEscalation(){
    if(state.gameOver || state.win) return;
    if(state.noise < state.maxNoise) return;
    if(state.combat){ state.pendingLockdown = true; return; }
    triggerLockdown();
  }

  function triggerLockdown(){
    log('\nALERTA MÁXIMO: bloqueio total. Um esquadrão de resposta converge sobre sua posição.','bad');
    const fromCtx = state.mode==='dungeon' ? 'dungeon' : 'hub';
    startCombat('response', fromCtx);
  }

  /* ============================ DUNGEON ============================ */
  function roomPoolForFloor(floor){
    if(floor===1) return [['cache',3],['glitch',2],['empty',2],['corpse',2],['terminal',1],['ambush',1],['hacker',1]];
    if(floor===2) return [['cache',2],['glitch',2],['corpse',2],['terminal',2],['ambush',2],['turret',2],['hacker',1],['empty',1]];
    return [['ambush',3],['turret',3],['corpse',2],['terminal',1],['glitch',1],['cache',1],['hacker',1]];
  }

  function pickDungeonEnemy(type){
    const floor = state.dungeon.floor;
    const ambushPool = ['ghoul','ratdrone','husk','choir'];
    const turretPool = ['wraith','sentinel9','drone'];
    let pool = type==='turret' ? turretPool.slice() : ambushPool.slice();
    if(floor>=3) pool.push('sentinel9');
    return choice(pool);
  }

  function descend(){
    if(state.mode!=='hub'){ log('Só é possível descer a partir da superfície.','warn'); return; }
    if(posKey(state.x,state.y)!=='2,1'){ log('Volte à Sala de Servidores para descer.','warn'); return; }
    if(!state.flags.cipher){ log('Os servidores ainda resistem. Hackeie KERNEL-9 para obter a Cifra de Rede primeiro.','warn'); return; }
    if(!state.flags.elevatorUnlocked){ log('A Cifra foi obtida, mas os elevadores continuam travados. Hackeie os servidores mais uma vez para reativá-los.','warn'); return; }
    if(state.flags.matrix){ log('O Núcleo K-9 já está em colapso. Não há razão para descer de novo.','sys'); return; }
    if(state.ap<=0){ log('PA insuficiente para acionar o elevador de manutenção.','warn'); return; }
    state.ap--;
    if(state.flags.sentryPursuit){
      endSentryPursuit();
      log('O poço do elevador corta o rastreio das sentinelas de superfície.','sys');
    }
    state.mode = 'dungeon';
    if(state.dungeon && state.dungeon.floor){
      log('\n[REINGRESSO] O elevador desce de volta ao ponto onde você parou no Núcleo K-9.','accent');
      log(`Você está em ${state.dungeon.floor}.${state.dungeon.roomIdx+1} :: ${DUNGEON_DESC[state.dungeon.currentType] || 'corredor'}`,'sys');
      renderAll();
      presentContextChoices();
      return;
    }
    state.flags.descended = true;
    state.dungeon = { floor:1, maxFloors:3, roomIdx:0, roomsPerFloor:3, hackerUsed:false, currentType:null, terminalHacked:false, groundLoot:null };
    log('\n[DESCIDA] O elevador de manutenção range e desce. O ar fica mais frio, mais sintético.','accent');
    unlockLore('descend');
    spawnDungeonRoom(true);
  }

  function retreatToSurface(){
    if(state.mode!=='dungeon'){ log('Comando válido apenas dentro do Núcleo K-9.','warn'); return; }
    if(state.combat){ log('Resolva o combate antes de recuar.','warn'); return; }
    if(state.ap<=0){ log('PA insuficiente para acionar o elevador de emergência.','warn'); return; }
    state.ap--;
    state.mode = 'hub';
    state.x = 2; state.y = 1;
    state.noise = clamp(state.noise+1,0,state.maxNoise);
    log('\n[RECUO] Você aciona o elevador de manutenção e sobe de volta à superfície. O Núcleo K-9 guarda sua posição — DESCER retoma de onde você parou.','accent');
    checkNoiseEscalation();
    if(state.combat) return;
    renderAll();
    presentContextChoices();
  }

  function spawnDungeonRoom(first){
    if(!first){
      decayDungeonGroundLoot();
      state.dungeon.roomIdx++;
      if(state.dungeon.roomIdx >= state.dungeon.roomsPerFloor){
        state.dungeon.roomIdx = 0;
        state.dungeon.floor++;
        if(state.dungeon.floor > state.dungeon.maxFloors){ spawnDungeonBoss(); return; }
        log(`\n[NÍVEL ${state.dungeon.floor}] O Núcleo K-9 se aprofunda. O ar muda de frequência.`,'accent');
      }
    }
    let type;
    if(state.dungeon.floor===2 && state.dungeon.roomIdx===1 && !state.dungeon.hackerUsed && !hasItem('cloak') && !state.flags.cloakHackerDealDone){
      type = 'hacker';
    } else {
      type = weightedChoice(roomPoolForFloor(state.dungeon.floor));
    }
    if(type==='hacker') state.dungeon.hackerUsed = true;
    state.dungeon.currentType = type;
    state.dungeon.terminalHacked = false;
    resolveDungeonRoom(type);
  }

  function resolveDungeonRoom(type){
    log(`\n[${state.dungeon.floor}.${state.dungeon.roomIdx+1}] ${DUNGEON_DESC[type]}`,'sys');
    if(state.dungeon.groundLoot){
      const gl = state.dungeon.groundLoot;
      log(`No chão desta área: ${ITEMS[gl.id].name}${gl.qty>1?` x${gl.qty}`:''}, ainda saqueável.`,'warn');
    }
    if(type==='cache'){
      const drop = randomSupplyDrop();
      if(drop.ok) log(`Suprimento recuperado: ${ITEMS[drop.id].name}${drop.qty>1?` x${drop.qty}`:''}.`,'good');
      else dropToGround(drop.id, drop.qty);
    } else if(type==='empty'){
      log('Nada além de estática residual.','dim');
    } else if(type==='glitch'){
      glitchEvent();
    } else if(type==='corpse'){
      corpseEvent();
    } else if(type==='terminal'){
      log('O painel ainda aceita comandos. HACKEAR pode valer o risco — ou pode chamar atenção.','warn');
    } else if(type==='hacker'){
      hackerEncounter();
    } else if(type==='turret' || type==='ambush'){
      startCombat(pickDungeonEnemy(type), 'dungeon');
      return;
    }
    if(state.gameOver) return;
    renderAll();
    presentContextChoices();
  }

  function hackerEncounter(){
    if(hasItem('cloak')){
      log('"Vejo que já está bem vestido." A silhueta sem rosto se desfaz no ruído antes que você pergunte mais.','dim');
    } else if(state.flags.cloakHackerDealDone){
      log('"Já fiz minha parte por hoje." O sinal cai antes que você responda.','dim');
    } else {
      log(`Uma silhueta sem rosto se sobrepõe ao seu canal. "Sei de um cofre de manutenção com uma Capa Termo-óptica esquecida lá dentro. Tenho a senha. ${HACKER_CLOAK_PRICE} créditos e ela é sua." A voz não tem pressa de se identificar — nem de provar que é confiável.`,'accent');
    }
  }

  function buyVaultPassword(){
    if(state.mode!=='dungeon' || !state.dungeon || state.dungeon.currentType!=='hacker'){ log('Sem ofertas disponíveis aqui.','warn'); return; }
    if(hasItem('cloak') || state.flags.cloakHackerDealDone){ log('Não há mais nada a comprar aqui.','warn'); return; }
    if(state.credits < HACKER_CLOAK_PRICE){ log('Créditos insuficientes.','warn'); return; }
    state.credits -= HACKER_CLOAK_PRICE;
    state.flags.cloakHackerDealDone = true;
    log(`Você paga ${HACKER_CLOAK_PRICE} créditos. A silhueta repassa coordenadas e uma senha de oito dígitos.`,'sys');
    if(Math.random()<0.8){
      if(addItem('cloak',1)){
        log('A senha funciona de primeira. O cofre de manutenção se abre e a Capa Termo-óptica é sua.','good');
      } else {
        log('A senha funciona de primeira. O cofre se abre — mas sua mochila está lotada.','warn');
        dropToGround('cloak',1);
      }
    } else {
      log('A senha falha — o cofre já trocou as travas. A silhueta já se foi, e seus créditos com ela.','bad');
    }
    renderAll();
    presentContextChoices();
  }

  function glitchEvent(){
    const r = rand(1,5);
    if(r===1){ state.stress = clamp(state.stress-1,0,state.maxStress); log('O ruído neural baixa por um instante. Você respira como quem ainda pode se dar ao luxo.','good'); }
    else if(r===2){ const c = rand(2,5); state.credits += c; log(`Um terminal fantasma transfere ${c} créditos perdidos.`,'good'); }
    else if(r===3){ state.hp = clamp(state.hp-2,0,state.maxHp); log('A falha do ambiente devolve dor em forma de descarga.','warn'); if(state.hp<=0) gameOver('A última coisa que você viu foi um frame congelado do próprio corpo.'); }
    else if(r===4){ state.noise = clamp(state.noise-2,0,state.maxNoise); log('Uma falha de áudio mascara seus próximos passos. Ruído -2.','good'); }
    else log('A realidade engasga. Você segue em frente.','sys');
  }

  function corpseEvent(){
    const r = rand(1,4);
    if(r===1){ addItem('stim',1); log('No bolso do morto, um Stim Patch ainda selado.','good'); }
    else if(r===2){ const c = rand(1,4); state.credits += c; log(`Bolso morto, créditos vivos: +${c}.`,'good'); }
    else if(r===3){ const a = rand(2,4); if(addItem('ammo',a)) log(`Alguns cartuchos sobreviveram no coldre: +${a} munição.`,'good'); }
    else { state.stress = clamp(state.stress+1,0,state.maxStress); log('Você reconhece o uniforme. Era de alguém que conhecia. Estresse +1.','warn'); checkStressOverload(); }
  }

  function spawnDungeonBoss(){
    log('\n[NÚCLEO PROFUNDO] O corredor termina num átrio sintético. Algo enorme pulsa no centro.','accent');
    unlockLore('boss_intro');
    startCombat('archon','dungeon');
  }

  function ascendFromDungeon(){
    state.mode = 'hub';
    state.x = 2; state.y = 1;
    log('\n[ASCENSÃO] O elevador sobe entre faíscas. A superfície parece quase gentil em comparação.','accent');
  }

  function advanceDungeon(){
    if(state.mode!=='dungeon'){ log('Comando válido apenas dentro do Núcleo K-9.','warn'); return; }
    if(state.combat){ log('Resolva o combate antes de avançar.','warn'); return; }
    if(state.ap<=0){ log('PA insuficiente. Descanse para recuperar antes de avançar.','warn'); return; }
    state.ap--;
    spawnDungeonRoom(false);
  }

  /* ============================ WIN / LOSE ============================ */
  function extract(){
    if(state.mode!=='hub'){ log('Extração só é possível na superfície.','warn'); return; }
    if(posKey(state.x,state.y)!=='0,0'){ log('Volte ao Refúgio Neon para chamar a extração.','warn'); return; }
    if(!(state.flags.matrix && state.flags.objective && state.flags.runner)){
      log('Faltam objetivos: Chip Omega, runner liberto e a matriz do Núcleo K-9.','warn');
      return;
    }
    winGame();
  }

  function winGame(){
    state.win = true; state.mode = 'win';
    log('\n=== EXTRAÇÃO CONFIRMADA ===','good');
    log('Morrow já está girando o motor. A cidade ainda apodrece, mas hoje ela paga aluguel para você.','good');
    log(`Saída com ${state.hp}/${state.maxHp} HP, ${state.stress}/${state.maxStress} estresse e ${state.credits} créditos.`,'dim');
    unlockLore('ending');
    renderAll();
    presentContextChoices();
  }

  function gameOver(msg){
    if(state.gameOver) return;
    state.gameOver = true; state.mode = 'gameover';
    log('\n=== FALHA DE MISSÃO ===','bad');
    log(msg,'bad');
    log('Digite reiniciar ou use o chip abaixo para tentar de novo.','sys');
    renderAll();
    presentContextChoices();
  }

  /* ============================ INFO COMMANDS ============================ */
  function unlockLore(key){
    if(!state.codex.includes(key)){
      state.codex.push(key);
      log(`[CODEX] Novo registro recuperado.`,'accent');
    }
  }

  function statusCmd(){
    const ds = derivedStats();
    log(`HP ${state.hp}/${state.maxHp} | Estresse ${state.stress}/${state.maxStress} | ARM ${ds.armor} | PA ${state.ap}/${state.maxAp} | Ruído ${state.noise}/${state.maxNoise} | Créditos ${state.credits}`,'accent');
    log(`Melee +${ds.melee}${ds.melee>state.melee?` (base ${state.melee}+${ds.melee-state.melee} lâmina)`:''} | Hack +${ds.hack} | Ranged +${ds.ranged}${ds.ranged>(state.ranged||0)?` (base ${state.ranged||0}+${ds.ranged-(state.ranged||0)} rifle)`:''}`,'dim');
    if(ds.equipped.length) log(`Equipado: ${ds.equipped.join(' · ')}`,'dim');
    if(state.combat) log(`Combate: ${state.combat.enemy.name} (${state.combat.enemy.hp}/${state.combat.enemy.maxHp})`,'warn');
  }

  function inventoryCmd(){
    if(!state.inventory.length){ log('Inventário vazio.','sys'); return; }
    log('Inventário:','accent');
    state.inventory.forEach(it=> log(`- ${ITEMS[it.id].name} x${it.qty} :: ${ITEMS[it.id].desc}`,'dim'));
  }

  function codexCmd(){
    if(!state.codex.length){ log('Nenhum registro recuperado ainda.','sys'); return; }
    log('Registros recuperados:','accent');
    state.codex.forEach(k=> log(`- ${LORE[k]}`,'dim'));
  }

  function mapCmd(){
    log('Mapa do Setor Alpha-7 (hub):','accent');
    for(let y=0;y<3;y++){
      let rowStr = '';
      for(let x=0;x<3;x++){
        const r = HUB[posKey(x,y)];
        const here = (x===state.x && y===state.y && state.mode==='hub');
        rowStr += (here ? '[*]' : '[ ]') + r.id.slice(0,4).padEnd(5,' ');
      }
      log(rowStr,'dim');
    }
    if(state.mode==='dungeon') log(`Núcleo K-9: Nível ${state.dungeon.floor}/${state.dungeon.maxFloors}, sala ${state.dungeon.roomIdx+1}/${state.dungeon.roomsPerFloor}`,'warn');
  }

  function help(){
    log('Comandos: olhar, scan, status, inventario, saquear, falar [npc], subornar, move norte/sul/leste/oeste, usar [item], hackear, descansar, esperar, comprar [item], loja, descer, retroceder, avancar, extrair, codex, mapa, reiniciar.','sys');
    log('Em combate: attack, hack, shoot, scan, use [item], flee.','sys');
    log('PA funciona como reserva de "mana": hackear sempre custa 1 PA, no hub, no Núcleo K-9 e também dentro de combate. Sem PA, sem intrusão — descanse para recuperar.','warn');
    log('Atalhos: clique nos chips do terminal ou use os botões fixos no rodapé.','dim');
  }

  /* ============================ CONTEXT CHOICES ============================ */
  function presentContextChoices(){
    if(state.mode==='select') return;
    if(state.gameOver || state.win){
      presentChoices([{ label:'Reiniciar Missão', cmd:'reiniciar' }]);
      return;
    }
    if(state.mode==='combat'){
      const chips = [
        { label:'Atacar', cmd:'attack' }
      ];
      if(state.ap>0) chips.push({ label:`Hackear (-1 PA)`, cmd:'hack' });
      chips.push({ label:'Varredura', cmd:'scan' });
      if(hasItem('rifle')){
        const rifleAmmoQty = (state.inventory.find(i=>i.id==='rifle_ammo')||{qty:0}).qty;
        if(rifleAmmoQty>0) chips.push({ label:`Disparar Rifle (${rifleAmmoQty} projéteis restantes)`, cmd:'shoot' });
      } else if(hasItem('pistol')){
        const ammoQty = (state.inventory.find(i=>i.id==='ammo')||{qty:0}).qty;
        if(ammoQty>0) chips.push({ label:`Disparar (${ammoQty} balas restantes)`, cmd:'shoot' });
      }
      state.inventory.forEach(it=>{
        if(['stim','battery','smoke','overclock','armor_patch','cipher'].includes(it.id)){
          chips.push({ label:`Usar: ${ITEMS[it.id].name}`, cmd:`usar ${it.id}` });
        }
      });
      chips.push({ label:'Fugir', cmd:'flee' });
      presentChoices(chips);
      return;
    }
    if(state.mode==='dungeon'){
      const t = state.dungeon.currentType;
      const chips = [];
      if(t==='terminal' && !state.dungeon.terminalHacked) chips.push({ label:'Hackear Terminal', cmd:'hack' });
      if(t==='hacker' && !hasItem('cloak') && !state.flags.cloakHackerDealDone){
        chips.push({ label:`Comprar Senha do Cofre (${HACKER_CLOAK_PRICE}cr)`, cmd:'comprarsenha' });
      }
      if(state.dungeon.groundLoot){
        const gl = state.dungeon.groundLoot;
        chips.push({ label:`Recolher: ${ITEMS[gl.id].name}${gl.qty>1?` x${gl.qty}`:''}`, cmd:'pegar' });
      }
      chips.push({ label:'Avançar', cmd:'advance' });
      chips.push({ label:'Descansar', cmd:'rest' });
      chips.push({ label:'Esperar', cmd:'wait' });
      //chips.push({ label:'Usar Item', cmd:'usaritem' });
      chips.push({ label:'Recuar à Superfície', cmd:'retroceder' });
      chips.push({ label:'Status', cmd:'status' });
      presentChoices(chips);
      return;
    }
    const room = currentRoom();
    const chips = [{ label:'Olhar', cmd:'look' }];
    if((room.loot||[]).some(en=>!state.looted[`${state.x},${state.y}|${en.id}`]) || (room.groundLoot||[]).length) chips.push({ label:'Saquear', cmd:'loot' });
    (activeNpcs(room)).forEach(id=> chips.push({ label:`Falar: ${NPCS[id].name}`, cmd:`talk ${id}` }));
    hubExits(state.x,state.y).forEach(dir=>{
      const v = DIRS[dir];
      const target = HUB[posKey(clamp(state.x+v[0],0,2), clamp(state.y+v[1],0,2))];
      const locked = target.locked && !state.flags[target.lockFlag];
      chips.push({ label:`Mover ▸ ${DIR_LABEL[dir]}${locked?' 🔒':''}`, cmd:`move ${dir}` });
    });
    if(room.hackable && !roomHackAlreadyDone(room)) chips.push({ label:'Hackear', cmd:'hack' });
    if(room.id==='security' && !state.flags.vaultAccess && activeNpcs(room).includes('guard_npc')) chips.push({ label:`Subornar Guarda (${BRIBE_PRICE}cr)`, cmd:'subornar' });
    if(room.shop) chips.push({ label:'Loja', cmd:'loja' });
    if(room.id==='server' && state.flags.elevatorUnlocked) chips.push({ label:'Descer ao Núcleo', cmd:'descer' });
    if(posKey(state.x,state.y)==='0,0' && state.flags.matrix && state.flags.objective && state.flags.runner) chips.push({ label:'Extrair', cmd:'extrair' });
    //chips.push({ label:'Usar Item', cmd:'usaritem' });
    chips.push({ label:'Descansar', cmd:'rest' });
    chips.push({ label:'Esperar', cmd:'wait' });
    presentChoices(chips);
  }

  /* ============================ CLASS SELECT / BOOT ============================ */
  function intro(){
    log('BOOT // CHROME TOMB :: HUMAN ERROR','accent');
    log('Terminal tático online. Carregando perfis de operativo disponíveis...','sys');
    presentClassChoices();
  }

  function presentClassChoices(){
    CLASSES.forEach(c=>{
      log(`${c.name} — ${c.tagline}`,'sys');
      log(`HP ${c.hp} | Estresse ${c.stress} | Armadura ${c.armor} | Melee +${c.melee} | Hack +${c.hack} | Ranged +${c.ranged} | Perk: ${c.perk} (${c.perkDesc})`,'dim');
    });
    presentChoices(CLASSES.map(c=>({ label:`Selecionar ${c.name}`, cmd:`classe ${c.key}` })));
  }

  function chooseClass(key){
    const c = CLASSES.find(cl=>cl.key===key);
    if(!c) return;
    state.className = c.name; state.perkKey = c.key; state.perk = c.perk; state.perkDesc = c.perkDesc;
    state.hp = c.hp; state.maxHp = c.hp; state.stress = c.stress; state.maxStress = c.stress; state.armor = c.armor; state.baseArmor = c.armor;
    state.melee = c.melee; state.hack = c.hack; state.ranged = c.ranged; state.ap = c.ap; state.maxAp = c.ap; state.credits = c.credits + rand(0,3);
    state.gear = c.gear.slice();
    state.inventory = c.items.map(it=>({ id:it.id, qty:it.qty }));
    state.mode = 'hub'; state.x = 0; state.y = 0;
    log(`\nOperativo carregado: ${c.name}.`,'good');
    log(`Perk ativo: ${c.perk} — ${c.perkDesc}`,'dim');
    log('Contrato de Morrow: recupere o Chip Omega, liberte o runner capturado no Datavault Omega e extraia a matriz de dados do Núcleo K-9. Depois, volte ao Refúgio Neon e extraia.','warn');
    enterRoom();
    renderAll();
    presentContextChoices();
  }

  function resetGame(){
    state = freshState();
    screen.innerHTML = '';
    activeChoiceButtons = [];
    closeDrawer();
    intro();
    renderAll();
    cmdInput.value = '';
    cmdInput.focus();
  }

  /* ============================ DISPATCHER ============================ */
  function runCommand(raw){
    const input = (raw||'').trim();
    if(!input) return;
    log(`> ${input}`, 'dim');

    const lower = input.toLowerCase();
    const parts = lower.split(/\s+/);
    const c = parts[0];
    const arg = parts.slice(1).join(' ');

    if(state.mode==='select'){
      if(c==='classe' && CLASSES.some(cl=>cl.key===arg)) chooseClass(arg);
      else log('Selecione um operativo usando os chips ou digite: classe runner | classe chrome | classe magus','warn');
      return;
    }
    if(state.gameOver || state.win){
      if(['reiniciar','restart','reset'].includes(c)) return resetGame();
      log('Missão encerrada. Digite reiniciar.','warn');
      return;
    }
    if(state.mode==='combat'){
      if(['attack','atacar','golpe'].includes(c)) return combatAction('attack');
      if(['hack','hackear','h'].includes(c)) return combatAction('hack');
      if(['shoot','disparar','atirar','fire'].includes(c)) return combatAction('ranged');
      if(['scan','varrer'].includes(c)) return combatAction('scan');
      if(['flee','fugir','correr'].includes(c)) return combatAction('flee');
      if(c==='use' || c==='usar') return useItem(arg);
      if(c==='status') return statusCmd();
      if(['inventory','inv','inventario','inventário'].includes(c)) return inventoryCmd();
      log('Ação inválida em combate. Use attack, hack, shoot, scan, use ou flee.','warn');
      return;
    }

    switch(c){
      case 'help': case 'ajuda': return help();
      case 'look': case 'olhar': return look();
      case 'scan': case 'varrer': return scan();
      case 'status': return statusCmd();
      case 'inventory': case 'inv': case 'inventario': case 'inventário': return inventoryCmd();
      case 'loot': case 'saquear': return loot();
      case 'pegar': case 'recolher': return state.mode==='dungeon' ? pickupDungeonGroundLoot() : loot();
      case 'talk': case 'falar': return talk(arg);
      case 'subornar': case 'bribe': return bribeGuard();
      case 'move': case 'ir': case 'go': return move(arg);
      case 'norte': case 'sul': case 'leste': case 'oeste': case 'n': case 's': case 'e': case 'o': return move(c);
      case 'use': case 'usar': return useItem(arg);
      case 'usaritem': return quickUse();
      case 'hack': case 'hackear': case 'h': return hack();
      case 'rest': case 'descansar': return rest();
      case 'wait': case 'esperar': case 'passar': return waitTurn();
      case 'attack': case 'atacar': case 'shoot': case 'disparar': return log('Sem alvo agora. Combate começa por encontro ou ambiente.','warn');
      case 'buy': case 'comprar': return buy(arg);
      case 'comprarsenha': return buyVaultPassword();
      case 'fullscreen': case 'telacheia': return toggleFullscreen();
      case 'loja': case 'shop': return openShop();
      case 'descer': case 'descend': return descend();
      case 'retroceder': case 'voltar': case 'recuar': case 'retreat': return retreatToSurface();
      case 'avancar': case 'avançar': case 'advance': return advanceDungeon();
      case 'extrair': case 'extract': return extract();
      case 'drop': case 'descartar': return dropItem(arg);
      case 'codex': return codexCmd();
      case 'map': case 'mapa': return mapCmd();
      case 'reiniciar': case 'restart': case 'reset': return resetGame();
      default: log('Comando desconhecido. Digite ajuda.','warn');
    }
  }

  /* ============================ RENDER ============================ */
  function renderTopPills(){
    topPills.innerHTML = `
      <div class="pill hp"><span class="k">HP</span><span class="v">${state.hp}/${state.maxHp}</span></div>
      <div class="pill ap"><span class="k">PA</span><span class="v">${state.ap}/${state.maxAp}</span></div>
      <div class="pill stress"><span class="k">Estresse</span><span class="v">${state.stress}/${state.maxStress}</span></div>
      <div class="pill noise"><span class="k">Ruído</span><span class="v">${state.noise}/${state.maxNoise}</span></div>
      <div class="pill cred"><span class="k">Créditos</span><span class="v">${state.credits}</span></div>
    `;
  }

  function buildStatusHTML(){
    if(state.mode==='select') return `<div class="card">Selecione um operativo no terminal para iniciar a missão.</div>`;
    const hpPct = clamp(state.hp/state.maxHp,0,1)*100;
    const stPct = clamp(state.stress/state.maxStress,0,1)*100;
    const apPct = state.maxAp ? clamp(state.ap/state.maxAp,0,1)*100 : 0;
    const noPct = clamp(state.noise/state.maxNoise,0,1)*100;
    const ds = derivedStats();
    const meleeBonus  = ds.melee  - state.melee;
    const armorBonus  = ds.armor  - state.baseArmor;
    const rangedBonus = ds.ranged - (state.ranged||0);
    const meleeStr    = `${ds.melee}${meleeBonus>0?` <span class="bonus">(+${meleeBonus})</span>`:''}`;
    const hackStr     = `${ds.hack}`;
    const rangedStr   = `${ds.ranged}${rangedBonus>0?` <span class="bonus">(+${rangedBonus})</span>`:''}`;
    const armorStr    = `${ds.armor}${armorBonus>0?` <span class="bonus">(+${armorBonus})</span>`:''}`;
    const equippedStr = ds.equipped.length ? ds.equipped.map(e=>`<div class="equip-row">◈ ${esc(e)}</div>`).join('') : '<span class="meta">Nenhum item passivo equipado.</span>';
    return `
      <div class="stat"><div class="k">HP</div><div class="v">${state.hp}/${state.maxHp}</div><div class="bar"><div class="fill" style="width:${hpPct}%"></div></div></div>
      <div class="stat"><div class="k">Estresse</div><div class="v">${state.stress}/${state.maxStress}</div><div class="bar"><div class="fill stress" style="width:${stPct}%"></div></div></div>
      <div class="stat"><div class="k">PA (mana de intrusão)</div><div class="v">${state.ap}/${state.maxAp}</div><div class="bar"><div class="fill ap" style="width:${apPct}%"></div></div></div>
      <div class="stat"><div class="k">Ruído</div><div class="v">${state.noise}/${state.maxNoise}</div><div class="bar"><div class="fill noise" style="width:${noPct}%"></div></div></div>
      <div class="statgrid">
        <div class="stat"><div class="k">Melee</div><div class="v">${meleeStr}</div></div>
        <div class="stat"><div class="k">Hack</div><div class="v">${hackStr}</div></div>
      </div>
      <div class="statgrid">
        <div class="stat"><div class="k">Ranged</div><div class="v">${rangedStr}</div></div>
        <div class="stat"><div class="k">Armadura</div><div class="v">${armorStr}</div></div>
      </div>
      <div class="statgrid">
        <div class="stat"><div class="k">Créditos</div><div class="v">${state.credits}</div></div>
      </div>
      <div class="card">
        <h4>Loadout</h4>
        <span class="meta">Classe:</span> ${esc(state.className||'—')}<br>
        <span class="meta">Perk:</span> ${esc(state.perk||'—')}<br>
        <span class="meta" style="font-size:10.5px">${esc(state.perkDesc||'')}</span><br>
        <span class="meta">Equipamento inicial:</span> ${esc((state.gear||[]).join(' / ')||'—')}<br>
      </div>
      <div class="card">
        <h4>Equipado</h4>
        ${equippedStr}
      </div>
    `;
  }

  function buildLocationHTML(){
    if(state.mode==='select') return `<div class="card">Aguardando seleção de operativo.</div>`;
    let html = '';
    if(state.mode==='combat'){
      const e = state.combat.enemy;
      html += `<div class="card"><h4>Combate</h4>${esc(e.name)}<br><span class="meta">HP ${e.hp}/${e.maxHp} · ARM ${e.armor} · ATK ${e.atk}${e.boss?' · CHEFE':''}</span></div>`;
    } else if(state.mode==='dungeon'){
      html += `<div class="card"><h4>Núcleo K-9</h4>Nível ${state.dungeon.floor}/${state.dungeon.maxFloors} — sala ${state.dungeon.roomIdx+1}/${state.dungeon.roomsPerFloor}<br><span class="meta">${esc(DUNGEON_DESC[state.dungeon.currentType]||'')}</span></div>`;
    } else {
      const room = currentRoom();
      html += `<div class="card"><h4>${esc(room.name)}</h4>${esc(room.desc)}</div>`;
      const npcsHere = activeNpcs(room);
      if(npcsHere.length){
        npcsHere.forEach(id=>{
          const n = NPCS[id];
          html += `<div class="npc-card"><strong>${esc(n.name)}</strong><br>"${esc(n.lines[0])}"</div>`;
        });
      }
    }
    html += `<div class="card"><h4>Objetivos</h4>`;
    const objs = [
      ['Comprometer os servidores (Cifra de Rede)', state.flags.cipher],
      ['Abrir o Datavault Omega (chip + runner)', state.flags.vaultCleared],
      ['Descer ao Núcleo K-9', state.flags.descended],
      ['Derrotar o Archon e recuperar a matriz', state.flags.matrix],
      ['Retornar ao Refúgio Neon e extrair', state.win]
    ];
    objs.forEach(([label, done])=>{
      html += `<div class="obj-row${done?' done':''}">${esc(label)}</div>`;
    });
    html += `</div>`;
    return html;
  }

  function buildInventoryHTML(){
    if(!state.inventory.length) return `<div class="card">Inventário vazio.</div>`;
    let html = `<div class="card meta" style="margin-bottom:10px;">Carga: ${currentLoad()}/${state.loadMax}</div>`;
    state.inventory.forEach(it=>{
      const def = ITEMS[it.id];
      const w = itemWeight(it.id, it.qty);
      const weightNote = it.id==='ammo' ? ` · ${w} carga (1 a cada 20)` : it.id==='rifle_ammo' ? ` · ${w} carga (1 a cada 10)` : '';
      html += `<div class="item-row">
        <div><div>${esc(def.name)} <span class="meta">x${it.qty}${weightNote}</span></div><div class="meta">${esc(def.desc)}</div></div>
        <div style="display:flex; gap:6px;">
          <button class="mini-btn" data-cmd="usar ${it.id}">Usar</button>
          <button class="mini-btn danger" data-cmd="descartar ${it.id}">Descartar</button>
        </div>
      </div>`;
    });
    return html;
  }

  function buildMapHTML(){
    let html = '<div class="mini-grid">';
    for(let y=0;y<3;y++){
      for(let x=0;x<3;x++){
        const r = HUB[posKey(x,y)];
        const here = (x===state.x && y===state.y && state.mode==='hub');
        html += `<div class="mini-cell${here?' here':''}">${esc(r.name)}</div>`;
      }
    }
    html += '</div>';
    if(state.mode==='dungeon'){
      html += `<div class="card"><h4>Núcleo K-9</h4>Nível ${state.dungeon.floor}/${state.dungeon.maxFloors} — sala ${state.dungeon.roomIdx+1}/${state.dungeon.roomsPerFloor}</div>`;
    }
    html += buildLocationHTML();
    return html;
  }

  function buildQuestHTML(){
    let html = buildLocationHTML();
    html += `<div class="card"><h4>Codex</h4>`;
    if(!state.codex.length) html += `<span class="meta">Nenhum registro recuperado ainda.</span>`;
    else state.codex.forEach(k=> html += `<div class="obj-row done" style="text-decoration:none; opacity:1; border-left-color:var(--ghost);">${esc(LORE[k])}</div>`);
    html += `</div>`;
    return html;
  }

  function buildHelpHTML(){
    return `
      <div class="card"><h4>Exploração</h4>
        <span class="kbd">olhar</span> <span class="kbd">scan</span> <span class="kbd">saquear</span> <span class="kbd">falar [npc]</span> <span class="kbd">subornar</span> <span class="kbd">move norte/sul/leste/oeste</span> <span class="kbd">hackear</span> <span class="kbd">descansar</span> <span class="kbd">esperar</span>
      </div>
      <div class="card"><h4>Itens & Comércio</h4>
        <span class="kbd">usar [item]</span> <span class="kbd">descartar [item]</span> <span class="kbd">loja</span> <span class="kbd">comprar [item]</span>
      </div>
      <div class="card"><h4>Combate</h4>
        <span class="kbd">attack</span> <span class="kbd">hack</span> <span class="kbd">shoot</span> <span class="kbd">scan</span> <span class="kbd">use [item]</span> <span class="kbd">flee</span>
      </div>
      <div class="card"><h4>Núcleo K-9</h4>
        <span class="kbd">descer</span> <span class="kbd">hackear</span> (terminais) <span class="kbd">avancar</span> <span class="kbd">retroceder</span> <span class="kbd">extrair</span>
      </div>
      <div class="card"><h4>Sistema</h4>
        <span class="kbd">status</span> <span class="kbd">inventario</span> <span class="kbd">codex</span> <span class="kbd">mapa</span> <span class="kbd">reiniciar</span>
      </div>
      <div class="card meta">PA funciona como mana: hackear sempre custa 1 PA — no hub, no Núcleo K-9 e também durante combate (chip "Hackear" some sem PA). Movimento e avanço também consomem PA. Descanse/espere para recuperar.</div>
    `;
  }

  function renderAll(){
    renderTopPills();
    leftPanelBody.innerHTML = buildStatusHTML();
    rightPanelBody.innerHTML = buildLocationHTML();
    if(currentDrawerKey) refreshDrawer();
  }

  /* ============================ DRAWER ============================ */
  const DRAWER_TITLES = { status:'Status do Operativo', inv:'Inventário', map:'Mapa & Objetivos', quest:'Missão & Codex', help:'Ajuda' };
  function isFullscreen(){
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function updateFullscreenBtn(){
    if(!fullscreenBtn) return;
    const on = isFullscreen();
    fullscreenBtn.textContent = on ? '⤦' : '⛶';
    fullscreenBtn.classList.toggle('active', on);
    fullscreenBtn.title = on ? 'Sair da tela cheia' : 'Tela cheia';
    fullscreenBtn.setAttribute('aria-label', fullscreenBtn.title);
  }
  async function toggleFullscreen(){
    try{
      if(!isFullscreen()){
        const el = document.documentElement;
        if(el.requestFullscreen) await el.requestFullscreen();
        else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        else { log('Tela cheia não é suportada neste navegador.','warn'); return; }
      } else {
        if(document.exitFullscreen) await document.exitFullscreen();
        else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    } catch(err){
      log('Não foi possível alternar a tela cheia.','warn');
    }
  }
  function openDrawer(key){
    currentDrawerKey = key;
    drawerOverlay.classList.add('open');
    refreshDrawer();
  }
  function closeDrawer(){
    currentDrawerKey = null;
    drawerOverlay.classList.remove('open');
  }
  function refreshDrawer(){
    drawerTitle.textContent = DRAWER_TITLES[currentDrawerKey] || '';
    if(currentDrawerKey==='status') drawerBody.innerHTML = buildStatusHTML();
    else if(currentDrawerKey==='inv') drawerBody.innerHTML = buildInventoryHTML();
    else if(currentDrawerKey==='map') drawerBody.innerHTML = buildMapHTML();
    else if(currentDrawerKey==='quest') drawerBody.innerHTML = buildQuestHTML();
    else if(currentDrawerKey==='help') drawerBody.innerHTML = buildHelpHTML();
  }

  /* ============================ EVENTS ============================ */
  document.querySelectorAll('.menu-btn').forEach(b=>{
    b.addEventListener('click', ()=> openDrawer(b.getAttribute('data-drawer')));
  });
  drawerClose.addEventListener('click', closeDrawer);
  drawerOverlay.addEventListener('click', (e)=>{ if(e.target===drawerOverlay) closeDrawer(); });
  drawerBody.addEventListener('click', (e)=>{
    const b = e.target.closest('[data-cmd]');
    if(b) runCommand(b.getAttribute('data-cmd'));
  });

  if(fullscreenBtn){
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', updateFullscreenBtn);
    document.addEventListener('webkitfullscreenchange', updateFullscreenBtn);
    if(!document.documentElement.requestFullscreen && !document.documentElement.webkitRequestFullscreen){
      fullscreenBtn.style.display = 'none';
    }
  }

  sendBtn.addEventListener('click', ()=>{
    const v = cmdInput.value; cmdInput.value = ''; runCommand(v);
  });
  cmdInput.addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){ const v = cmdInput.value; cmdInput.value=''; runCommand(v); }
  });
  window.addEventListener('keydown', (e)=>{
    if(e.key==='/' && document.activeElement!==cmdInput){ e.preventDefault(); cmdInput.focus(); }
    if(e.key==='Escape') closeDrawer();
  });
  screen.addEventListener('click', (e)=>{
    if(e.target.tagName!=='BUTTON') cmdInput.focus();
  });

  /* ============================ INIT ============================ */
  state = freshState();
  intro();
  renderAll();
  updateFullscreenBtn();
  cmdInput.focus();

})();
</script>
</body>
</html>
